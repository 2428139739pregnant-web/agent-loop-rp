        for (const frame of frames) {
          try {
            frame.contentWindow.postMessage({ type: 'agent-rp-card-prepare-generation', id: frame.id }, '*')
          } catch {
            // A card iframe can disappear between the query and the postMessage.
            // Treat it as having no local filter instead of leaving the handshake
            // waiting for the timeout.
            expected.delete(frame.id)
          }
        }
        if (expected.size === 0) finish()
      })
      if (!results?.hasFunctionFilter || !Array.isArray(results.filters) || results.filters.length === 0) return
      try {
        await apiPut(`/api/sessions/${encodeURIComponent(String(sessionId))}/tavern-helper`, {
          format: 0,
          operation: 'update-injection-filters',
          filters: results.filters,
        })
      } catch (error) {
        console.warn('[agent-rp Tavern Helper filter]', error)
      }
    }

    function CardHtmlSurface({ source, mvuState, character, characterId = '', historyLength = 0, sessionId = null, surfaceKind = 'content', userName = '用户', onVariablesChange = null, onChatRefresh = null, onDisplayedMessage = null }) {
      const frameRef = useRef(null)
      const frameId = useRef(`card-frame-${Math.random().toString(36).slice(2)}`)
      const sessionIdRef = useRef(sessionId)
      const initialMvuState = useRef(mvuState)
      const latestMvuState = useRef(mvuState)
      const onVariablesChangeRef = useRef(onVariablesChange)
      const onChatRefreshRef = useRef(onChatRefresh)
      const onDisplayedMessageRef = useRef(onDisplayedMessage)
      sessionIdRef.current = sessionId
      latestMvuState.current = mvuState
      onVariablesChangeRef.current = onVariablesChange
      onChatRefreshRef.current = onChatRefresh
      onDisplayedMessageRef.current = onDisplayedMessage
      const helperScripts = character?.frontend?.tavernHelperScripts || []
      const rawCharacter = character?.raw && typeof character.raw === 'object' && !Array.isArray(character.raw)
        ? character.raw : null
      const rawCharacterData = rawCharacter?.data && typeof rawCharacter.data === 'object' && !Array.isArray(rawCharacter.data)
        ? rawCharacter.data : null
      // SillyTavern exposes the normalized card data as `character` and the
      // lossless V2/V3 envelope as `RawCharacter`. Keep both views in the
      // iframe bootstrap so card scripts do not race the first postMessage.
      const characterProjection = {
        ...(rawCharacterData || {}),
        name: character?.name || rawCharacterData?.name || '',
        description: character?.persona || rawCharacterData?.description || '',
        personality: character?.style || rawCharacterData?.personality || '',
        scenario: character?.worldview || rawCharacterData?.scenario || '',
        data: rawCharacterData || {},
      }
      const initialCharacterContext = {
        rawCharacter,
        characterData: rawCharacterData || characterProjection,
        character: characterProjection,
        characters: [characterProjection],
        characterId: 0,
        agentCharacterId: characterId || character?.id || '',
        name1: userName,
        name2: characterProjection.name,
      }
      const [height, setHeight] = useState(1)
      const frameDocument = useMemo(
        () => buildCardFrameDocument(source, frameId.current, initialMvuState.current, character?.frontend?.tavernHelperVariables || {}, helperScripts, character?.frontend?.tavernHelperScriptTrees || {}, sessionId, initialCharacterContext),
        [source, character?.frontend?.tavernHelperVariables, helperScripts, character?.frontend?.tavernHelperScriptTrees, character?.raw, characterId, userName, sessionId],
      )
      const syncFrameState = () => {
        const frame = frameRef.current
        if (!frame?.contentWindow) return Promise.resolve()
        const state = latestMvuState.current
        frame.contentWindow.postMessage({ type: 'agent-rp-card-variables', id: frameId.current, variables: state?.stat_data ? state : { stat_data: state || {} } }, '*')
        frame.contentWindow.postMessage({ type: 'agent-rp-card-theme', id: frameId.current, theme: document.documentElement.dataset.theme || '' }, '*')
        const activeSessionId = sessionIdRef.current
        if (activeSessionId) {
          return Promise.all([
            apiGet(`/api/history?sessionId=${encodeURIComponent(activeSessionId)}&raw=1`),
            apiGet(`/api/sessions/${encodeURIComponent(activeSessionId)}/tavern-helper`),
          ]).then(([historySnapshot, helperSnapshot]) => {
            const messages = (historySnapshot.history || []).map((message, index) => ({
              message_id: Number.isSafeInteger(message?.message_id) ? message.message_id : index,
              name: message.role === 'user' ? userName : message.role === 'assistant' ? (character?.name || 'assistant') : 'system',
              role: message.role || 'assistant',
              is_user: message.role === 'user',
              // In ST's context `is_system` means hidden from the model, not
              // a system-role message. Keep the role separately for callers
              // that use the compatibility projection.
              is_system: message.is_hidden === true,
              mes: String(message.content || ''),
              message: String(message.content || ''),
              content: String(message.content || ''),
              ...(message.data && typeof message.data === 'object' ? { data: message.data } : {}),
              ...(message.extra && typeof message.extra === 'object' ? { extra: message.extra } : {}),
              ...(Number.isSafeInteger(message.swipe_id) ? { swipe_id: message.swipe_id } : {}),
              ...(Array.isArray(message.swipes) ? { swipes: message.swipes } : {}),
              ...(Array.isArray(message.swipe_info) ? { swipe_info: message.swipe_info } : {}),
            }))
             const helperState = helperSnapshot.tavernHelperState || {}
             frame.contentWindow?.postMessage({
              type: 'agent-rp-card-context',
              id: frameId.current,
              context: {
                chat: messages,
                characters: [characterProjection],
                character: characterProjection,
                characterId: 0,
                agentCharacterId: characterId || character?.id || '',
                rawCharacter,
                characterData: rawCharacterData || characterProjection,
                name1: userName,
                name2: character?.name || '',
                chatId: activeSessionId,
              chatMetadata: helperState.chatMetadata && typeof helperState.chatMetadata === 'object'
                ? helperState.chatMetadata : {},
                extensionPrompts: Object.fromEntries((Array.isArray(helperState.injectedPrompts) ? helperState.injectedPrompts : []).map((prompt) => [
                  prompt.id,
                  { value: prompt.content, position: prompt.position === 'none' ? -1 : prompt.position === 'in_prompt' ? 0 : prompt.position === 'before_prompt' ? 2 : 1, depth: prompt.depth || 0, scan: prompt.shouldScan !== false, role: prompt.role === 'system' ? 0 : prompt.role === 'user' ? 1 : 2, filter: prompt.filter !== false },
                ])),
              },
            }, '*')
             frame.contentWindow?.postMessage({
               type: 'agent-rp-card-helper-state',
              id: frameId.current,
              scopes: helperSnapshot.variableScopes || helperSnapshot.tavernHelperState?.scopes || {},
              scripts: helperSnapshot.tavernHelperState?.scripts || {},
              scriptTrees: helperSnapshot.tavernHelperState?.scriptTrees || {},
               mvuState: helperSnapshot.mvuState,
             }, '*')
             if (helperSnapshot.worldInfoEntries && typeof helperSnapshot.worldInfoEntries === 'object') {
               frame.contentWindow?.postMessage({
                 type: 'agent-rp-card-host-event',
                 id: frameId.current,
                 eventName: 'worldinfo_entries_loaded',
                 args: [helperSnapshot.worldInfoEntries],
               }, '*')
             }
          }).catch(() => { /* a card may render before a session is available */ })
        }
        return Promise.resolve()
      }
      const notifyFrameReady = () => {
        syncFrameState()
        const frame = frameRef.current
        const activeSessionId = sessionIdRef.current
        postCardHostEvent(frame, 'chat_id_changed', [activeSessionId])
        postCardHostEvent(frame, 'chatLoaded', [activeSessionId])
        postCardHostEvent(frame, 'chat_completion_settings_ready', [{ sessionId: activeSessionId }])
      }
      useEffect(() => {
        const frame = frameRef.current
        const onViewportResize = () => frame?.contentWindow?.postMessage({ type: 'TH_UPDATE_VIEWPORT_HEIGHT' }, '*')
        const onMessage = (event) => {
          if (!frame || event.source !== frame.contentWindow) return
          const data = event.data
          if (!data || data.id !== frameId.current) return
          if (data.type === 'agent-rp-card-script-error') {
            console.error('[agent-rp card script]', data.error || data)
            return
          }
          if (data.type === 'agent-rp-card-variable-replace') {
            const next = data.variables?.stat_data ? data.variables : { stat_data: data.variables || {} }
            onVariablesChangeRef.current?.(next)
            return
          }
          if (data.type === 'agent-rp-card-rpc') {
            const requestId = typeof data.requestId === 'string' ? data.requestId : ''
            const respond = (payload) => {
              try { frame.contentWindow?.postMessage({ type: 'agent-rp-card-rpc-result', id: frameId.current, requestId, ok: true, value: payload }, '*') } catch { /* */ }
            }
            const fail = (error) => {
              try { frame.contentWindow?.postMessage({ type: 'agent-rp-card-rpc-result', id: frameId.current, requestId, ok: false, error: String(error?.message || error) }, '*') } catch { /* */ }
            }
            const activeSessionId = sessionIdRef.current
            if (!requestId || !activeSessionId) { fail(new Error('no active session for Tavern Helper RPC')); return }
            const runRpc = async () => {
              const endpoint = `/api/sessions/${encodeURIComponent(activeSessionId)}/tavern-helper`
              const refreshMode = value => value === false || value === 'none' ? 'none' : value === true ? 'affected' : value === 'all' ? 'all' : 'affected'
              const refreshMutation = async (mode, messageIds = []) => {
                if (mode === 'none') return
                if (mode === 'all') {
                  await broadcastCardHostEvent(activeSessionId, 'chat_id_changed', activeSessionId)
                  return
                }
                const ids = messageIds.length > 0 ? messageIds : [-1]
                for (const messageId of ids) await broadcastCardHostEvent(activeSessionId, 'message_updated', messageId)
              }
              const readDisplayHistory = async () => {
                const result = await apiGet(`/api/history?sessionId=${encodeURIComponent(activeSessionId)}&raw=1`)
                return Array.isArray(result.history) ? result.history : []
              }
              const resolveDisplayMessageId = (raw, messages) => {
                const ids = messages.map((message, index) => Number.isSafeInteger(message?.message_id) ? message.message_id : index)
                if (raw === 'last' || raw === undefined || raw === null) return ids.at(-1) ?? -1
                if (raw === 'last_user') return messages.map((message, index) => message?.role === 'user' ? ids[index] : -1).filter(id => id >= 0).at(-1) ?? -1
                if (raw === 'last_char') return messages.map((message, index) => message?.role === 'assistant' ? ids[index] : -1).filter(id => id >= 0).at(-1) ?? -1
                const value = Number(raw)
                if (!Number.isSafeInteger(value)) return -1
                return value < 0 ? (ids.at(value) ?? value) : value
              }
              if (data.method === 'format-as-displayed-message') {
                const messages = await readDisplayHistory()
                const messageId = resolveDisplayMessageId(data.payload?.messageId, messages)
                if (!messages.some((message, index) => (Number.isSafeInteger(message?.message_id) ? message.message_id : index) === messageId)) throw new Error(`displayed message id is out of range: ${messageId}`)
                return formatDisplayedMessageHtml(data.payload?.text, messageId, messages, character, userName)
              }
              if (data.method === 'displayed-message-mutation') {
                const payload = data.payload || {}
                const messageId = Number(payload.messageId)
                if (!Number.isSafeInteger(messageId) || messageId < 0) throw new Error('displayed message id must be a non-negative integer')
                const operation = String(payload.operation || '')
                if (operation === 'refresh') {
                  onDisplayedMessageRef.current?.({ messageId, operation: 'refresh' })
                } else if (operation === 'empty') {
                  onDisplayedMessageRef.current?.({ messageId, operation: 'html', html: '' })
                } else if (operation === 'html') {
                  onDisplayedMessageRef.current?.({ messageId, operation: 'html', html: String(payload.value ?? '') })
                } else if (operation === 'text') {
                  onDisplayedMessageRef.current?.({ messageId, operation: 'text', text: String(payload.value ?? '') })
                } else if (operation === 'append') {
                  onDisplayedMessageRef.current?.({ messageId, operation: 'append', html: String(payload.value ?? '') })
                } else throw new Error(`unsupported displayed message mutation: ${operation}`)
                return { ok: true }
              }
              if (data.method === 'refresh-one-message') {
                const messages = await readDisplayHistory()
                const sourceMessageId = resolveDisplayMessageId(data.payload?.messageId, messages)
                if (!messages.some((message, index) => (Number.isSafeInteger(message?.message_id) ? message.message_id : index) === sourceMessageId)) throw new Error(`displayed message id is out of range: ${sourceMessageId}`)
                const targetMessageId = Number.isSafeInteger(data.payload?.targetMessageId) ? data.payload.targetMessageId : sourceMessageId
                onDisplayedMessageRef.current?.({ messageId: targetMessageId, operation: 'refresh' })
                return { ok: true, messageId: sourceMessageId, targetMessageId }
              }
              if (data.method === 'get-chat-messages') {
                const result = await apiGet(`/api/history?sessionId=${encodeURIComponent(activeSessionId)}&raw=1`)
                const source = Array.isArray(result.history) ? result.history : []
                const options = data.payload?.options && typeof data.payload.options === 'object' ? data.payload.options : {}
                const allMessages = source.map((message, index) => ({
                  message_id: Number.isSafeInteger(message?.message_id) ? message.message_id : index,
                  name: typeof message?.name === 'string' ? message.name : message?.role === 'user' ? userName : message?.role === 'assistant' ? (character?.name || 'assistant') : 'system',
                  role: message?.role || 'assistant',
                  is_user: message?.role === 'user',
                  is_system: message?.role === 'system',
                  is_hidden: message?.is_hidden === true,
                  mes: String(message?.content || ''),
                  message: String(message?.content || ''),
                  content: String(message?.content || ''),
                  data: message?.data && typeof message.data === 'object' ? message.data : {},
                  extra: message?.extra && typeof message.extra === 'object' ? message.extra : {},
                  ...(Number.isSafeInteger(message?.swipe_id) ? { swipe_id: message.swipe_id } : {}),
                  ...(Array.isArray(message?.swipes) ? { swipes: message.swipes } : {}),
                  ...(Array.isArray(message?.swipes_data) ? { swipes_data: message.swipes_data } : {}),
                  ...(Array.isArray(message?.swipes_info) ? { swipes_info: message.swipes_info } : {}),
                }))
                allMessages.sort((left, right) => left.message_id - right.message_id)
                const ids = allMessages.map(message => message.message_id)
                const resolveBoundary = (raw) => {
                  const number = Number(raw)
                  if (!Number.isFinite(number)) return null
                  if (number < 0) return ids.at(number) ?? null
                  return number
                }
                const range = data.payload?.range
                let start = ids[0] ?? 0
                let end = ids.at(-1) ?? -1
                if (range !== undefined && range !== null && range !== '') {
                  const text = String(range).replace(/\{\{lastMessageId\}\}/gu, String(ids.at(-1) ?? -1))
                  const pair = text.match(/^(-?\d+)\s*-\s*(-?\d*)$/u)
                  if (pair) {
                    start = resolveBoundary(pair[1])
                    // Tavern Helper accepts open-ended ranges such as
                    // "0-"; an omitted end means the current last floor.
                    end = pair[2] === '' ? (ids.at(-1) ?? -1) : resolveBoundary(pair[2])
                  } else {
                    start = resolveBoundary(text)
                    end = start
                  }
                }
                if (start === null || end === null || start > end) return []
                let selected = allMessages.filter(message => message.message_id >= start && message.message_id <= end)
                const role = options.role === 'system' || options.role === 'assistant' || options.role === 'user' ? options.role : 'all'
                if (role !== 'all') selected = selected.filter(message => message.role === role)
                const hideState = options.hide_state === 'hidden' || options.hide_state === 'unhidden' ? options.hide_state : 'all'
                if (hideState === 'hidden') selected = selected.filter(message => message.is_hidden)
                if (hideState === 'unhidden') selected = selected.filter(message => !message.is_hidden)
                return options.include_swipes === true ? selected : selected.map(({swipe_id,swipes,swipes_data,swipes_info,...message})=>message)
              }
              if (data.method === 'get-model-list') {
                const customApi=data.payload?.custom_api&&typeof data.payload.custom_api==='object'?data.payload.custom_api:{};
                const apiurl=String(customApi.apiurl||'').trim();
                if(!apiurl)throw new Error('getModelList requires custom_api.apiurl');
                const params=new URLSearchParams({provider:'openai',baseUrl:apiurl});
                if(customApi.key!==undefined)params.set('apiKey',String(customApi.key));
                const result=await apiGet('/api/models?'+params.toString());
                return Array.isArray(result?.models)?result.models.map(model=>String(model?.id||'')).filter(Boolean):[];
              }
              if (data.method === 'generate-raw') {
                // This is a private auxiliary completion.  The host route
                // validates ordered_prompts and calls the provider once; it
                // never enters the normal Agent RP loop or appends history.
                return apiPost(`/api/sessions/${encodeURIComponent(activeSessionId)}/tavern-helper/generate-raw`, data.payload || {})
              }
              if (data.method === 'stop-generation') {
                return apiPost(`/api/sessions/${encodeURIComponent(activeSessionId)}/tavern-helper/stop-generation`, data.payload || {})
              }
              if (data.method === 'activate-world-info') {
                return apiPost(`/api/sessions/${encodeURIComponent(activeSessionId)}/tavern-helper/activate-world-info`, data.payload || {})
              }
              const state = data.method === 'get-worldbook' || data.method === 'get-char-worldbook-names' || data.method === 'get-worldbook-names'
                || data.method === 'get-global-worldbook-names' || data.method === 'get-chat-worldbook-name'
                || data.method === 'get-variable-scopes'
                ? await apiGet(endpoint) : null
              if (data.method === 'get-variable-scopes') return state?.variableScopes || state?.tavernHelperState?.scopes || {}
              if (data.method === 'get-worldbook') {
                const name = String(data.payload?.name || '')
                return state?.tavernHelperState?.worldbooks?.[name] || []
              }
              if (data.method === 'get-char-worldbook-names') {
                const bindings = state?.tavernHelperState?.worldbookBindings?.character
                return bindings || { primary: null, additional: [] }
              }
              if (data.method === 'get-global-worldbook-names') return state?.tavernHelperState?.worldbookBindings?.global || []
              if (data.method === 'get-chat-worldbook-name') return state?.tavernHelperState?.worldbookBindings?.chat ?? null
              if (data.method === 'get-worldbook-names') return Object.keys(state?.tavernHelperState?.worldbooks || {})
              if (data.method === 'set-chat-message') {
                const messageId = Number(data.payload?.messageId)
                if (!Number.isSafeInteger(messageId) || messageId < 0) throw new Error('chat message id must be a non-negative integer')
                const fields = data.payload?.fields && typeof data.payload.fields === 'object' && !Array.isArray(data.payload.fields)
                  ? data.payload.fields
                  : { message: String(data.payload?.message ?? '') }
                const result = await apiPut(endpoint, { format: 0, operation: 'set-chat-messages', messages: [fields], refresh: data.payload?.options?.refresh })
                await syncFrameState()
                const mode = refreshMode(data.payload?.options?.refresh)
                await refreshMutation(mode, [messageId])
                await onChatRefreshRef.current?.(mode, [messageId])
                return result
              }
              if (data.method === 'set-chat-messages') {
                const result = await apiPut(endpoint, { format: 0, operation: 'set-chat-messages', messages: data.payload?.messages || [], refresh: data.payload?.options?.refresh })
                await syncFrameState()
                const ids = (Array.isArray(data.payload?.messages) ? data.payload.messages : []).map(message => message?.message_id).filter(Number.isSafeInteger)
                const mode = refreshMode(data.payload?.options?.refresh)
                await refreshMutation(mode, ids)
                await onChatRefreshRef.current?.(mode, ids)
                return result
              }
              if (data.method === 'create-chat-messages' || data.method === 'delete-chat-messages' || data.method === 'rotate-chat-messages' || data.method === 'set-chat-hidden') {
                const payload = data.payload || {}
                const operation = data.method
                const insertBefore = payload.options?.insert_before !== undefined
                  ? payload.options.insert_before
                  : payload.options?.insert_at !== undefined
                    ? payload.options.insert_at
                    : 'end'
                const body = operation === 'create-chat-messages'
                  ? { format: 0, operation, messages: payload.messages || [], insertAt: insertBefore === 'end' || Number.isSafeInteger(insertBefore) ? insertBefore : 'end', refresh: payload.options?.refresh }
                  : operation === 'delete-chat-messages'
                    ? { format: 0, operation, messageIds: payload.messageIds || [], refresh: payload.options?.refresh }
                    : operation === 'rotate-chat-messages'
                      ? { format: 0, operation, begin: payload.begin, middle: payload.middle, end: payload.end, refresh: payload.options?.refresh }
                      : { format: 0, operation, start: payload.start, end: payload.end, hidden: payload.hidden, refresh: payload.options?.refresh }
                const result = await apiPut(endpoint, body)
                await syncFrameState()
                const mode = refreshMode(payload.options?.refresh)
                if (mode !== 'none' && operation === 'delete-chat-messages') {
                  if (mode === 'all') await refreshMutation(mode)
                  else for (const messageId of Array.isArray(payload.messageIds) ? payload.messageIds : []) await broadcastCardHostEvent(activeSessionId, 'message_deleted', messageId)
                } else await refreshMutation(mode, operation === 'create-chat-messages' ? [] : [payload.begin, payload.middle, payload.end].filter(Number.isSafeInteger))
                await onChatRefreshRef.current?.(mode, operation === 'delete-chat-messages'
                  ? (Array.isArray(payload.messageIds) ? payload.messageIds : [])
                  : operation === 'create-chat-messages'
                    ? []
                    : [payload.begin, payload.middle, payload.end].filter(Number.isSafeInteger))
                return result
              }
              if (data.method === 'tavern-helper-mutation') {
                const payload = data.payload || {}
                const result = await apiPut(endpoint, payload)
                await syncFrameState()
                if (['replace-worldbook', 'bind-global-worldbooks', 'bind-character-worldbooks', 'bind-chat-worldbook', 'update-worldbook'].includes(String(payload.operation || ''))) {
                  broadcastCardHostEvent(activeSessionId, 'worldinfo_updated', payload.name || null)
                }
                if (['set-chat-messages', 'create-chat-messages', 'delete-chat-messages', 'rotate-chat-messages', 'set-chat-hidden', 'set-chat-message'].includes(String(payload.operation || ''))) {
                  broadcastCardHostEvent(activeSessionId, 'message_updated', Number.isSafeInteger(payload.messageId) ? payload.messageId : -1)
                  const mode = refreshMode(payload.options?.refresh)
                  const ids = Array.isArray(payload.messageIds)
                    ? payload.messageIds
                    : Number.isSafeInteger(payload.messageId) ? [payload.messageId] : []
                  await onChatRefreshRef.current?.(mode, ids)
                }
                return result
              }
              throw new Error(`unsupported Tavern Helper RPC: ${String(data.method || '')}`)
            }
            void runRpc().then(respond).catch(fail)
            return
          }
          if (data.type !== 'agent-rp-card-frame-height') return
          const next = Number(data.height)
          if (!Number.isFinite(next)) return
          setHeight((previous) => Math.abs(previous - next) > 1 ? Math.max(1, Math.min(12000, Math.ceil(next))) : previous)
        }
        window.addEventListener('message', onMessage)
        window.addEventListener('resize', onViewportResize)
        frame?.addEventListener('load', onViewportResize)
        onViewportResize()
        return () => {
          window.removeEventListener('message', onMessage)
          window.removeEventListener('resize', onViewportResize)
          frame?.removeEventListener('load', onViewportResize)
        }
      }, [])
      useEffect(() => {
        syncFrameState()
      }, [mvuState, userName, character, characterId, historyLength, sessionId])
      return h('iframe', {
        ref: frameRef,
        id: frameId.current,
        name: frameId.current,
        className: 'msg-card-html-frame',
        title: '角色卡 HTML 美化内容',
        // Tavern Helper's predefine/parent_jquery layer is a same-origin
        // parent bridge. Keep scripts sandboxed, but allow same-origin so
        // the parent can perform the same height-observer fallback when a
        // card's first postMessage happens before React subscribes.
        sandbox: 'allow-scripts allow-same-origin',
        scrolling: 'no',
        srcDoc: frameDocument,
        'data-card-surface': surfaceKind,
        'data-session-id': sessionId || '',
        onLoad: notifyFrameReady,
        style: { height: `${height}px` },
      })
    }

    function displaySourceLines(value) {
      const lines = []
      const re = /[^\r\n]*(?:\r\n|\r|\n|$)/gu
      for (const match of value.matchAll(re)) {
        const text = match[0]
        const start = match.index
        if (text === '' && start === value.length) break
        lines.push({ start, end: start + text.length, text })
      }
      return lines
    }

    // 角色卡前端不一定包在完整的 <html> 文档里。很多 ST 卡会通过
    // Regex 直接生成 <div class="card">...</div> 片段；这类片段若先交给
    // marked，<style> 会被当作 Markdown 内容拆坏，最终只剩普通文字。
    function hasCardFrontendMarkup(source) {
      return /<!doctype\s+html\b|<html(?:\s|>)|<(?:head|body|style|script|link|div|section|article|main|header|footer|nav|aside|details|summary|table|form|button|canvas|svg|h[1-6])(?:\s|>)/iu.test(source)
    }

    function isCardFrontendFragment(source) {
      const trimmed = String(source || '').trimStart()
      return /^(?:<!doctype\s+html\b|<html(?:\s|>)|<(?:head|body|style|script|link|div|section|article|main|header|footer|nav|aside|details|summary|table|form|button|canvas|svg|h[1-6])(?:\s|>))/iu.test(trimmed)
    }

    function isCardFrontendDocument(info, source) {
      const completeDocument = (/(?:<!doctype\s+html\b|<html(?:\s|>))\s*/iu.test(source)
        && /<\/html\s*>/iu.test(source))
      if (completeDocument) return true
      if (info.trim().split(/\s+/u)[0]?.toLowerCase() === 'html') return true
      // ST also treats common structural HTML fragments as frontend display
      // documents even when the author omitted the `html` fence language.
      return hasCardFrontendMarkup(source)
    }

    function compileDisplaySegments(value) {
      const lines = displaySourceLines(value)
      const segments = []
      let cursor = 0
      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i]
        const opening = line.text.match(/^ {0,3}(`{3,}|~{3,})[ \t]*([^\r\n]*?)[ \t]*(?:\r\n|\r|\n|$)/u)
        if (!opening) continue
        const marker = opening[1]
        let closingIndex = -1
        for (let j = i + 1; j < lines.length; j += 1) {
          const closing = lines[j].text.match(/^ {0,3}(`{3,}|~{3,})[ \t]*(?:\r\n|\r|\n|$)/u)
          if (closing && closing[1][0] === marker[0] && closing[1].length >= marker.length) {
            closingIndex = j; break
          }
        }
        if (closingIndex < 0) continue
        const closingLine = lines[closingIndex]
        const source = value.slice(line.end, closingLine.start)
        if (!isCardFrontendDocument(opening[2] || '', source)) continue
        const before = value.slice(cursor, line.start)
        if (before) segments.push({ kind: isCardFrontendFragment(before) ? 'html' : 'markdown', source: before })
        segments.push({ kind: 'html', source })
        cursor = closingLine.end
        i = closingIndex
      }
      const rest = value.slice(cursor)
      if (rest) {
        const hasFrontendMarkup = hasCardFrontendMarkup(rest)
        segments.push({ kind: hasFrontendMarkup && isCardFrontendFragment(rest) ? 'html' : 'markdown', source: rest })
      }
      return segments.length > 0 ? segments : [{ kind: 'markdown', source: value }]
    }

    /** 消息内容渲染:角色卡 display Regex → HTML/Markdown 分段 → 安全渲染。
     * 角色卡的 markdownOnly 脚本只影响显示，promptOnly 脚本不会污染显示；
     * 普通 Markdown 继续走 marked + 白名单净化，角色卡前端进入独立
     * iframe；iframe 只负责自身排版，滚动仍由外层 .chat 统一负责。 */
    function MessageContent({ content, role, character, characterId = '', historyLength = 0, sessionId = null, depth = 0, userName = '用户', mvuState = null, onVariablesChange = null, onChatRefresh = null, onDisplayedMessage = null, displayOverride = null }) {
      if (displayOverride !== null && typeof displayOverride === 'string') {
        return h('div', { className: 'msg-text msg-content-stack msg-display-override' },
          h('div', { className: 'msg-markdown', dangerouslySetInnerHTML: { __html: sanitizeHtml(displayOverride) } }),
        )
      }
      const processed = applyDisplayRegex(content, role === 'user' ? 1 : 2, character, depth, userName)
      const segments = compileDisplaySegments(processed)
      const rendered = segments.flatMap((segment, index) => {
        if (segment.kind === 'html') {
          return [h('div', { key: `html-surface-${index}`, className: 'msg-html-surface', 'data-surface-kind': 'content' },
            h(CardHtmlSurface, { source: segment.source, mvuState, character, characterId, historyLength, sessionId, userName, surfaceKind: 'content', onVariablesChange, onChatRefresh, onDisplayedMessage }),
          )]
        }
        const markdownHtml = marked.parse(segment.source, { gfm: true, breaks: true })
        return [h('div', { key: `md-${index}`, className: 'msg-markdown', dangerouslySetInnerHTML: { __html: sanitizeHtml(markdownHtml) } })]
      })
      return h('div', { className: 'msg-text msg-content-stack' }, rendered)
    }

    /**
     * SillyTavern-style message floor. The rendered message is only the
     * display surface; edit mode always exposes the original stored content
     * so card markers, regex placeholders and MVU blocks can be inspected or
     * corrected without losing them to the renderer.
     */
    function MessageFloor({
      message, index, total, character, characterId, sessionId, userName, mvuState, onVariablesChange, onChatRefresh, onDisplayedMessage, displayOverride = null,
      disabled = false, onReroll = null, onSwipe = null, onSaveEdit, onDelete,
    }) {
      const [collapsed, setCollapsed] = useState(false)
      const [editing, setEditing] = useState(false)
      const [draft, setDraft] = useState(message.content)
      const [saving, setSaving] = useState(false)
      const isLatestAssistant = index === total - 1 && message.role === 'assistant'

      useEffect(() => {
        if (!editing) setDraft(message.content)
      }, [message.content, editing])

      const save = async () => {
        setSaving(true)
        try {
          await onSaveEdit(index, draft)
          setEditing(false)
          setCollapsed(false)
        } finally {
          setSaving(false)
        }
      }

      const roleLabel = message.role === 'assistant' ? 'ASSISTANT' : message.role === 'user' ? 'USER' : 'SYSTEM'
      const preview = String(message.content || '').replace(/\s+/gu, ' ').trim().slice(0, 180)
      const floorStatus = collapsed ? ' floor-collapsed' : ''
      const swipes = Array.isArray(message.swipes) ? message.swipes : []
      const swipeId = Number.isInteger(message.swipe_id) ? message.swipe_id : 0
      const hasSwipes = message.role === 'assistant' && swipes.length > 1

      return h('div', { className: `msg floor-${message.role}${floorStatus}` },
        h('div', { className: 'floor-head' },
          h('button', {
            className: 'floor-toggle',
            title: collapsed ? '展开楼层' : '收起楼层',
            onClick: () => setCollapsed((value) => !value),
          }, collapsed ? '▸' : '▾'),
          h('span', { className: 'floor-index' }, `第 ${index + 1} 层`),
          h('span', { className: 'floor-role' }, roleLabel),
          collapsed ? h('span', { className: 'floor-preview', title: preview }, preview || '(空消息)') : null,
          h('div', { className: 'floor-actions' },
            hasSwipes
              ? h('span', { className: 'swipe-controls', role: 'group', 'aria-label': '切换本层回复' },
                  h('button', {
                    className: 'floor-action swipe-control', title: '上一条回复', disabled: disabled || swipeId <= 0,
                    onClick: () => { if (onSwipe) void onSwipe(index, swipeId - 1) },
                  }, '‹'),
                  h('span', { className: 'swipe-counter', 'aria-live': 'polite' }, `${swipeId + 1}/${swipes.length}`),
                  h('button', {
                    className: 'floor-action swipe-control', title: '下一条回复', disabled: disabled || swipeId >= swipes.length - 1,
                    onClick: () => { if (onSwipe) void onSwipe(index, swipeId + 1) },
                  }, '›'),
                )
              : null,
            h('button', {
              className: 'floor-action', title: editing ? '取消编辑' : '编辑本层', disabled: disabled || saving,
              onClick: () => { setEditing((value) => !value); setCollapsed(false) },
            }, editing ? '取消' : '编辑'),
            editing
              ? h('button', {
                  className: 'floor-action floor-action-primary', title: '保存本层', disabled: disabled || saving,
                  onClick: () => { void save() },
                }, saving ? '保存中…' : '保存')
              : null,
            isLatestAssistant && onReroll
              ? h('button', {
                  className: 'floor-action', title: '重 roll 当前回复', disabled: disabled,
                  onClick: () => { void onReroll() },
                }, '重 roll')
              : null,
            h('button', {
              className: 'floor-action floor-action-danger', title: '删除本层', disabled: disabled || saving,
              onClick: () => { void onDelete(index) },
            }, '删除'),
          ),
        ),
        editing
          ? h('div', { className: 'floor-editor' },
              h('textarea', {
                className: 'floor-editor-input', value: draft, disabled: saving,
                onChange: (event) => setDraft(event.target.value),
                spellCheck: false,
              }),
              h('div', { className: 'floor-editor-hint' }, '编辑的是原始楼层内容；保存后会重新应用角色卡正则、Markdown、HTML 与 MVU 展示。'),
            )
          : collapsed
            ? h('div', { className: 'floor-collapsed-body' }, preview || '(空消息)')
            : h(MessageContent, {
                content: message.content, role: message.role, character, characterId, historyLength: total,
                sessionId, depth: Math.max(0, total - index - 1), userName, mvuState, onVariablesChange, onChatRefresh, onDisplayedMessage, displayOverride,
              }),
      )
    }

    /** 单个 stage 的可展开 trace 卡片。⑤ postprocess 的同步正文链路拆成独立 stage,
     *  每个 stage 都是独立卡片,不再嵌套 sub-trace。 */
    function StageTraceCard(/** @type {{name:string, status:string, trace: AgentTrace|null}} */ props) {
      const { name, status, trace } = props
      const [open, setOpen] = useState(false)
      const [tab, setTab] = useState(() => trace?.promptJson ? 'prompt' : 'output')
      const label = STAGE_LABELS[name] || name
      const payload = tab === 'prompt'
        ? trace?.promptJson
        : (tab === 'output' ? trace?.outputJson : trace?.inputJson)
      return h('div', { className: `stage-card stage-card-${status}` },
        h('div', { className: 'stage-card-head', onClick: () => setOpen((o) => !o) },
          h('span', { className: 'stage-card-dot' }),
          h('span', { className: 'stage-card-label' }, label),
          trace ? h('span', { className: 'stage-card-duration' }, `${trace.durationMs}ms`) : null,
          trace?.usageTotal ? h('span', { className: 'stage-card-tokens' }, tokenLabel(trace.usageTotal)) : null,
          trace?.reused ? h('span', { className: 'stage-card-reused' }, '复用') : null,
          h('span', { className: 'stage-card-status' }, status === 'done' ? '✓' : (status === 'error' ? '✗' : (status === 'running' ? '…' : '○'))),
          h('span', { className: 'stage-card-toggle' }, open ? '▾' : '▸'),
        ),
        open && trace ? h('div', { className: 'stage-card-body' },
          h('div', { className: 'stage-card-tabs' },
            h('button', { className: 'mini ' + (tab === 'output' ? 'active' : ''), onClick: () => setTab('output') }, '输出'),
            h('button', { className: 'mini ' + (tab === 'input' ? 'active' : ''), onClick: () => setTab('input') }, '输入'),
            trace?.promptJson ? h('button', { className: 'mini ' + (tab === 'prompt' ? 'active' : ''), onClick: () => setTab('prompt') }, '实际提示词') : null,
            trace && (trace.outputJson.length > 500 || trace.inputJson.length > 500)
              ? h('span', { className: 'hint', style: { marginLeft: 'auto' } }, 'JSON 可能很长,可滚动')
              : null,
          ),
          payload === undefined ? null : h('pre', { className: 'stage-card-payload' }, prettyJson(payload)),
        ) : null,
        open && !trace ? h('div', { className: 'stage-card-body hint' }, '(无 I/O,等待 stage 完成…)') : null,
      )
    }

    function prettyJson(s) {
      // 简单 pretty-print:把字符串用 JSON.parse 解析再 stringify(indent 2)
      // 如果解析失败(被截断),原样返回
      try { return JSON.stringify(JSON.parse(s), null, 2) } catch { return s }
    }

    /** 从当前 progressStages 里挑出所有 stage name,按"顶层 + 后处理子"顺序排:
     *   - 顶层:intent → worldbook → context → response → summarize
     *   - 后处理子:postprocess-gate → postprocess-pass-a → pass-b → pass-c
     *  实际跑的子集(看 progressStages 当前 key 集合),按这个固定顺序展示。 */
    function AgentProgress(/** @type {{stages: typeof INITIAL_STAGES, traces: Record<string, AgentTrace>}} */ { stages, traces }) {
      const allOrder = [
        'intent', 'worldbook', 'context', 'response', 'mvu',
        'postprocess-gate', 'postprocess-pass-a', 'postprocess-pass-b',
        'postprocess-pass-c', 'postprocess-extract',
        'summarize',
      ]
      const visible = allOrder.filter((n) => stages[n] !== undefined || traces[n] !== undefined)
      return h('div', { className: 'stage-traces' },
        h('div', { className: 'stage-traces-head' }, 'Agent 链路(点击展开 I/O)'),
        visible.map((name) => h(StageTraceCard, {
          key: name,
          name,
          status: stages[name] || 'pending',
          trace: traces[name] || null,
        })),
      )
    }

    // ─── Trace viewer:按轮回看持久化的 agent trace(traces.jsonl) ────────
    const TRACE_STAGE_ORDER = ['intent', 'worldbook', 'context', 'response', 'mvu']
    const TRACE_PREVIEW_CHARS = 500

    /** 单个 JSON payload 展示:pretty-print,超长默认截断 + "展开全部"。 */
    function TracePayload(/** @type {{jsonStr: string, expandKey: string, expanded: boolean, full?: boolean, onExpand: (k: string) => void}} */ props) {
      const pretty = prettyJson(props.jsonStr)
      if (props.full === true || pretty.length <= TRACE_PREVIEW_CHARS || props.expanded) {
        return h('pre', { className: 'stage-card-payload' }, pretty)
      }
      return h('div', null,
        h('pre', { className: 'stage-card-payload' }, pretty.slice(0, TRACE_PREVIEW_CHARS) + ` …(共 ${pretty.length} 字符,已截断)`),
        h('button', { className: 'mini', style: { marginTop: '2px' }, onClick: () => props.onExpand(props.expandKey) }, '展开全部'),
      )
    }

    /** 一轮里的单个 stage 卡片(持久化 trace 版,只读)。 */
    function TraceStageCard(/** @type {{trace: AgentTrace, traceKey: string}} */ props) {
      const [open, setOpen] = useState(false)
      const [tab, setTab] = useState(() => props.trace.promptJson ? 'prompt' : 'output')
      const [expandedAll, setExpandedAll] = useState(() => new Set())
      const t = props.trace
      const toggleAll = (k) => setExpandedAll((prev) => {
        const next = new Set(prev); if (next.has(k)) next.delete(k); else next.add(k); return next
      })
      const expandKey = `${props.traceKey}:${tab}`
      return h('div', { className: 'stage-card stage-card-done' },
        h('div', { className: 'stage-card-head', onClick: () => setOpen((o) => !o) },
          h('span', { className: 'stage-card-dot' }),
          h('span', { className: 'stage-card-label' }, STAGE_LABELS[t.name] || t.name),
          h('span', { className: 'stage-card-duration' }, `${t.durationMs}ms`),
          t.usageTotal ? h('span', { className: 'stage-card-tokens' }, tokenLabel(t.usageTotal)) : null,
          t.reused ? h('span', { className: 'stage-card-reused' }, '复用') : null,
          h('span', { className: 'stage-card-toggle' }, open ? '▾' : '▸'),
        ),
        open ? h('div', { className: 'stage-card-body' },
          h('div', { className: 'stage-card-tabs' },
            h('button', { className: 'mini ' + (tab === 'output' ? 'active' : ''), onClick: () => setTab('output') }, '输出'),
            h('button', { className: 'mini ' + (tab === 'input' ? 'active' : ''), onClick: () => setTab('input') }, '输入'),
            t.promptJson ? h('button', { className: 'mini ' + (tab === 'prompt' ? 'active' : ''), onClick: () => setTab('prompt') }, '实际提示词') : null,
            h('span', { className: 'hint', style: { marginLeft: 'auto' } }, fmtTime(t.ts)),
          ),
          h(TracePayload, {
            jsonStr: tab === 'prompt' ? t.promptJson : (tab === 'output' ? t.outputJson : t.inputJson),
            expandKey,
            expanded: expandedAll.has(expandKey),
            full: tab === 'prompt',
            onExpand: toggleAll,
          }),
        ) : null,
      )
    }

    /** Agent 追踪查看器:选会话 → GET /api/sessions/:id/traces → 按 turn 分组。 */
    function TracePanel(/** @type {{currentSessionId: string|null, refreshTick: number, onError: (e: string) => void}} */ props) {
      const [sessions, setSessions] = useState(/** @type {SessionInfo[]} */([]))
      const [selected, setSelected] = useState(null)
      const [traces, setTraces] = useState(/** @type {AgentTrace[]} */([]))
      const [turnStats, setTurnStats] = useState([])
      const [loading, setLoading] = useState(false)
      const [error, setError] = useState(null)
      const [expandedTurns, setExpandedTurns] = useState(() => new Set())

      const refreshSessions = useCallback(async () => {
        try {
          const r = await apiGet('/api/sessions')
          setSessions(r.sessions || [])
        } catch (err) { setError(String(err.message || err)) }
      }, [])

      useEffect(() => { void refreshSessions() }, [refreshSessions, props.refreshTick])

      // 跟随主界面当前会话切换
      useEffect(() => { if (props.currentSessionId !== null) setSelected(props.currentSessionId) }, [props.currentSessionId])

      const load = useCallback(async (sid) => {
        if (sid === null) { setTraces([]); setTurnStats([]); return }
        setLoading(true); setError(null)
        try {
          const r = await apiGet(`/api/sessions/${encodeURIComponent(sid)}/traces`)
          const list = /** @type {AgentTrace[]} */ (r.traces || [])
          setTraces(list)
          setTurnStats(r.turnStats || [])
          // 数据量大时只默认展开最后一次生成；runId 让同一 user turn 的重 roll 分开。
          const turns = [...new Set(list.map((t) => `${t.turn}:${t.runId || 'legacy'}`))]
          const lastTurn = turns.length > 0 ? turns[turns.length - 1] : null
          setExpandedTurns(lastTurn === null ? new Set() : new Set([lastTurn]))
        } catch (err) {
          setError(String(err.message || err)); setTraces([]); setTurnStats([])
        } finally { setLoading(false) }
      }, [])

      useEffect(() => { void load(selected) }, [selected, load, props.refreshTick])

      const toggleTurn = (k) => setExpandedTurns((prev) => {
        const next = new Set(prev); if (next.has(k)) next.delete(k); else next.add(k); return next
      })

      // 按 user turn + generation 分组；同一轮的重 roll 不与原回复混在一起。
      const runKey = (t) => `${t.turn}:${t.runId || 'legacy'}`
      const byTurn = new Map()
      for (const t of traces) {
        const k = runKey(t)
        if (!byTurn.has(k)) byTurn.set(k, [])
        byTurn.get(k).push(t)
      }
      const turnKeys = [...byTurn.keys()].reverse()

      return h('div', { className: 'panel' },
        h('h2', null, `Agent 追踪 (${traces.length})`),
        h('div', { className: 'field' },
          h('div', { className: 'row' },
            h('select', {
              value: selected ?? '', style: { flex: 1 },
              onChange: (e) => setSelected(e.target.value.length > 0 ? e.target.value : null),
            },
              h('option', { value: '' }, '— 选择会话 —'),
              ...sessions.map((s) => h('option', { key: s.sessionId, value: s.sessionId },
                `${s.label} · ${s.characterName} · ${s.turnCount}t`)),
            ),
            h('button', { onClick: () => { void load(selected) }, disabled: loading || selected === null, title: '重新拉取 traces' }, loading ? '…' : '↻'),
          ),
          h('div', { className: 'hint' }, '每轮 4 个 stage 的输入/输出落盘回看(刷新不丢);默认只展开最后一轮。'),
        ),
        error ? h('div', { className: 'error-banner' }, error) : null,
        selected === null
          ? h('div', { className: 'list-empty' }, '先选择一个会话')
          : traces.length === 0
            ? h('div', { className: 'list-empty' }, loading ? '加载中…' : '该会话暂无 trace(发一轮对话后生成)')
            : h('div', { className: 'trace-turns' },
                turnKeys.map((k) => {
                  const group = byTurn.get(k) || []
                  const runStat = turnStats.find((s) => s.runId === group[0]?.runId) || null
                  const turnNumber = group[0]?.turn ?? '—'
                  const ordered = [
                    ...group.filter((t) => TRACE_STAGE_ORDER.includes(t.name))
                      .sort((a, b) => TRACE_STAGE_ORDER.indexOf(a.name) - TRACE_STAGE_ORDER.indexOf(b.name)),
                    ...group.filter((t) => !TRACE_STAGE_ORDER.includes(t.name)),
                  ]
                  const totalMs = ordered.reduce((sum, t) => sum + (t.durationMs || 0), 0)
                  return h('div', { key: k, className: 'trace-turn' },
                    h('div', { className: 'trace-turn-head', onClick: () => toggleTurn(k) },
                      h('span', { className: 'trace-turn-toggle' }, expandedTurns.has(k) ? '▾' : '▸'),
                      h('span', { className: 'trace-turn-label' }, `第 ${turnNumber} 轮${runStat?.reroll ? ' · 重 roll' : ''}`),
                      h('span', { className: 'trace-turn-count' }, `${ordered.length} stage · ${totalMs}ms${runStat ? ` · 总 ${fmtTokens(runStat.total.totalTokens)} tok` : ''}`),
                    ),
                    expandedTurns.has(k) ? h('div', { className: 'trace-turn-stages' },
                      runStat ? h('div', { className: 'trace-token-summary' },
                        h('div', { className: 'trace-token-total' }, `本轮总计：${fmtTokens(runStat.total.totalTokens)} token${runStat.total.estimated ? '（估算）' : ''}`),
                        h('div', { className: 'trace-token-agents' },
                          Object.entries(runStat.agents || {}).map(([name, usage]) => h('span', { key: name, className: 'trace-token-agent' },
                            `${STAGE_LABELS[name] || name} ${tokenLabel(usage)}${usage.reused ? ' · 复用' : ''}${usage.deferred ? ' · 异步' : ''}`,
                          )),
                        ),
                      ) : null,
                      ordered.map((t, i) => h(TraceStageCard, { key: `${k}:${t.name}:${i}`, trace: t, traceKey: `${k}:${i}` })),
                    ) : null,
                  )
                }),
              ),
      )
    }

    // ─── 全局正则脚本(酒馆 Regex 扩展) ────────────────────────────────────
    // display 位在前端渲染时应用(不落库);user_input/ai_output 位由服务端应用。
    // 应用逻辑与 src/agent-loop/regex-scripts.ts 保持一致(前端无法 import ts,双实现)。
    let displayRegexScripts = /** @type {{id:string,scriptName:string,findRegex:string,replaceString:string,trimStrings:string[],placement:string[],disabled:boolean,markdownOnly:boolean,promptOnly:boolean,runOnEdit:boolean,substituteRegex:number,minDepth:number|null,maxDepth:number|null}[]} */([])
    function regexFromStringUI(input) {
      try {
        const literal = String(input).match(/^\/([\s\S]*)\/([a-z]*)$/iu)
        if (literal === null) return new RegExp(String(input))
        const flags = literal[2] || ''
        if (flags && !/^(?!.*?(.).*?\1)[dgimsuvy]+$/u.test(flags)) return new RegExp(String(input))
        return new RegExp(literal[1] || '', flags)
      } catch { return null }
    }
    function regexDepthUI(script, depth) {
      if (depth === undefined || depth === null) return true
      if (script.minDepth !== null && script.minDepth !== undefined && Number(script.minDepth) >= -1 && depth < Number(script.minDepth)) return false
      if (script.maxDepth !== null && script.maxDepth !== undefined && Number(script.maxDepth) >= 0 && depth > Number(script.maxDepth)) return false
      return true
    }
    function regexEscapeUI(value) {
      return String(value || '').replace(/[\\^$.*+?()\[\]{}|/\-]/g, '\\$&')
    }
    function expandRegexReplacementUI(template, match, captures, groups, offset, input, trimStrings, character, userName) {
      const prefix = input.slice(0, offset)
      const suffix = input.slice(offset + match.length)
      let replacement = String(template || '').replace(/\{\{match\}\}/giu, match)
      replacement = replacement.replace(/\$\$|\$&|\$`|\$'|\$\d{1,2}|\$<([^>]+)>/gu, (token, named) => {
        if (token === '$$') return '$'
        if (token === '$&') return match
        if (token === '$`') return prefix
        if (token === "$'") return suffix
        if (named !== undefined) {
          const captured = groups && groups[named]
          if (captured === undefined || captured === null) return ''
          let out = String(captured)
          for (const trim of (trimStrings || [])) if (trim) out = out.split(cardMacro(trim, character, userName)).join('')
          return out
        }
        const number = Number(token.slice(1))
        if (number === 0) return match
        const captured = captures[number - 1]
        if (captured === undefined || captured === null) return ''
        let out = String(captured)
        for (const trim of (trimStrings || [])) if (trim) out = out.split(cardMacro(trim, character, userName)).join('')
        return out
      })
      return cardMacro(replacement, character, userName)
    }
    function runRegexScriptUI(script, rawString, character = null, userName = '用户', depth = undefined) {
      if (script.disabled || !script.findRegex || !rawString) return rawString
      if (script.promptOnly && !script.markdownOnly) return rawString
      if (!regexDepthUI(script, depth)) return rawString
      const mode = Number(script.substituteRegex || 0)
      let findSource = String(script.findRegex)
      if (mode !== 0) {
        findSource = cardMacro(findSource, character, userName)
        if (mode === 2) findSource = regexEscapeUI(findSource)
      }
      const find = regexFromStringUI(findSource)
      if (!find) return rawString
      try {
        return rawString.replace(find, (...args) => {
          const last = args[args.length - 1]
          const groups = last && typeof last === 'object' ? last : undefined
          const input = String(groups === undefined ? last : args[args.length - 2] || rawString)
          const offsetIndex = groups === undefined ? args.length - 2 : args.length - 3
          const offset = typeof args[offsetIndex] === 'number' ? args[offsetIndex] : 0
          return expandRegexReplacementUI(script.replaceString, String(args[0] || ''), args.slice(1, offsetIndex), groups, offset, input, script.trimStrings, character, userName)
        })
      } catch { return rawString }
    }
    function cardMacro(value, character, userName = '用户') {
      const name = character && typeof character.name === 'string' ? character.name : ''
      return String(value || '')
        .replace(/\{\{char\}\}|<char>|<bot>/giu, name)
        .replace(/\{\{user\}\}|<user>/giu, userName)
    }
    function cardRegexFind(script, character, userName) {
      let find = String(script.findRegex || '')
      const mode = Number(script.substituteRegex || 0)
      if (mode === 1) find = cardMacro(find, character, userName)
      if (mode === 2) find = cardMacro(find, character, userName).replace(/[\\^$.*+?{}[\]\\/|()]/g, '\\$&')
      return find
    }
    function runCardRegexScriptUI(script, rawString, character, userName = '用户') {
      if (script.disabled || !script.findRegex || !rawString) return rawString
      const find = regexFromStringUI(cardRegexFind(script, character, userName))
      if (!find) return rawString
      try {
        return rawString.replace(find, (...args) => {
          const last = args[args.length - 1]
          const groups = last && typeof last === 'object' ? last : undefined
          const input = String(groups === undefined ? last : args[args.length - 2] || rawString)
          const offsetIndex = groups === undefined ? args.length - 2 : args.length - 3
          const offset = typeof args[offsetIndex] === 'number' ? args[offsetIndex] : 0
          return expandRegexReplacementUI(script.replaceString, String(args[0] || ''), args.slice(1, offsetIndex), groups, offset, input, script.trimStrings, character, userName)
        })
      } catch { return rawString }
    }
    function cardRegexInDepth(script, depth) {
      if (depth === undefined || depth === null) return true
      if (script.minDepth !== null && script.minDepth !== undefined && Number(script.minDepth) >= -1 && depth < Number(script.minDepth)) return false
      return script.maxDepth === null || script.maxDepth === undefined || Number(script.maxDepth) < 0 || depth <= Number(script.maxDepth)
    }
    function applyDisplayRegex(text, placement = 2, character = null, depth = undefined, userName = '用户') {
      let out = text
      for (const s of displayRegexScripts) {
        const markdownPlacement = s.markdownOnly && s.placement.includes(placement === 1 ? 'user_input' : 'ai_output')
        if (s.disabled || (!s.placement.includes('display') && !markdownPlacement)) continue
        out = runRegexScriptUI(s, out, character, userName, depth)
      }
      const scoped = character && character.frontend && Array.isArray(character.frontend.regexScripts)
        ? character.frontend.regexScripts : []
      const eligible = scoped.filter((s) => !s.disabled && Array.isArray(s.placement)
        && s.placement.includes(placement) && cardRegexInDepth(s, depth))
      // In SillyTavern's messageFormatting(..., isMarkdown: true) pass,
      // ordinary scoped scripts and promptOnly scripts do not run again.
      // They belong to the stored/prompt pipeline.  Running them here made
      // placeholders expand twice and was one source of misplaced HUD HTML.
      for (const s of eligible) {
        if (s.markdownOnly) out = runCardRegexScriptUI(s, out, character, userName)
      }
      return out
    }
    function expandDisplayedMessageMacros(value, messageId, messages, character, userName = '用户') {
      const list = Array.isArray(messages) ? messages : []
      const ids = list.map((message, index) => Number.isSafeInteger(message?.message_id) ? message.message_id : index)
      const index = ids.indexOf(messageId)
      const lastUser = list.map((message, itemIndex) => message?.role === 'user' ? itemIndex : -1).filter(itemIndex => itemIndex >= 0).at(-1)
      const lastChar = list.map((message, itemIndex) => message?.role === 'assistant' ? itemIndex : -1).filter(itemIndex => itemIndex >= 0).at(-1)
      return cardMacro(value, character, userName)
        .replace(/\{\{lastMessageId\}\}/giu, String(ids.at(-1) ?? -1))
        .replace(/\{\{messageId\}\}/giu, String(messageId ?? index))
        .replace(/\{\{lastUserMessageId\}\}/giu, String(lastUser === undefined ? -1 : ids[lastUser]))
        .replace(/\{\{lastCharMessageId\}\}/giu, String(lastChar === undefined ? -1 : ids[lastChar]))
    }
    function escapeDisplayedText(value) {
      return String(value ?? '').replace(/&/gu, '&amp;').replace(/</gu, '&lt;').replace(/>/gu, '&gt;').replace(/"/gu, '&quot;').replace(/'/gu, '&#39;').replace(/\r?\n/gu, '<br>')
    }
    function formatDisplayedMessageHtml(text, messageId, messages, character, userName = '用户') {
      const list = Array.isArray(messages) ? messages : []
      const index = list.findIndex((message, itemIndex) => (Number.isSafeInteger(message?.message_id) ? message.message_id : itemIndex) === messageId)
      const message = index >= 0 ? list[index] : null
      const placement = message?.role === 'user' ? 1 : 2
      const depth = index >= 0 ? Math.max(0, list.length - index - 1) : undefined
      const processed = applyDisplayRegex(expandDisplayedMessageMacros(text, messageId, list, character, userName), placement, character, depth, userName)
      const segments = compileDisplaySegments(processed)
      const html = segments.map((segment) => segment.kind === 'html'
        ? sanitizeHtml(segment.source)
        : sanitizeHtml(marked.parse(segment.source, { gfm: true, breaks: true }))).join('')
      return { html, text: processed, messageId }
    }
    function refreshDisplayRegexScripts() {
      return apiGet('/api/regex').then((r) => { displayRegexScripts = r.scripts || [] }).catch(() => {})
    }

                  h('option', { value: 0 }, '不替换'), h('option', { value: 1 }, '原样替换'), h('option', { value: 2 }, '转义替换'),

    // ─── Prompts panel ────────────────────────────────────────────────────

      const [content, setContent] = useState('')
      const [loading, setLoading] = useState(false)

      useEffect(() => { refresh() }, [refresh])
