<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Agent RP · 角色扮演 Harness</title>
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "marked": "https://esm.sh/marked@16.4.2"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useRef, useCallback, useMemo } from 'react'
    import { createRoot } from 'react-dom/client'
    import { marked } from 'marked'
    import * as AgentRpZod from 'https://esm.sh/zod@4.1.12'
    import * as AgentRpYaml from 'https://esm.sh/yaml@2.9.0'
    import * as AgentRpVue from 'https://esm.sh/vue@3.5.20'
    import AgentRpLodash from 'https://esm.sh/lodash@4.17.21'

    const h = React.createElement
    // JS-Slash-Runner's predefine.js inherits shared browser libraries from
    // the SillyTavern host before any card module is evaluated. Keep the same
    // ordering here; the iframe runtime reads this synchronously during its
    // first inline script.
    window.__agentRpSharedLibraries = Object.freeze({ z: AgentRpZod, YAML: AgentRpYaml, Vue: AgentRpVue, _: AgentRpLodash })
    // These are the globals that JS-Slash-Runner's predefine.js normally
    // inherits from SillyTavern. Keep them on the host as well as in the
    // iframe so third-party modules that explicitly read window.parent see
    // the same dependency surface.
    window.z = AgentRpZod
    window.YAML = AgentRpYaml
    window.Vue = AgentRpVue
    window._ = AgentRpLodash

    // ─── Wire types ──────────────────────────────────────────────────────
    /**
     * @typedef {Object} Character
     * @property {string} name
     * @property {string} persona
     * @property {string} worldview
     * @property {string} style
     * @property {string} firstMes
     * @property {string[]} alternateGreetings
     * @property {string} preprocessedAt
     * @property {{name:string, entryCount:number, enabledCount:number} | null} lorebook
     */
    /** @typedef {{id:string, name:string, createdAt:string, updatedAt:string, hasLorebook:boolean, lorebookName:string|null, personaPreview:string, greetingCount:number}} CharacterSummary */
    /** @typedef {{role:'user'|'assistant'|'system', content:string, swipe_id?:number, swipes?:string[], swipe_info?:Array<Object>}} HistoryMessage */
    /** @typedef {{sessionId:string, label:string, characterName:string, createdAt:string, turnCount:number}} SessionInfo */
    /** @typedef {{sourceId:string, name:string|null, keys:string[], secondaryKeys:string[], content:string, enabled:boolean, insertionOrder:number, selective:boolean, constant:boolean, caseSensitive:boolean, matchWholeWords:boolean, useRegex:boolean, position:'before_char'|'after_char', priority:number|null, selectiveLogic?:string, probability?:number, useProbability?:boolean, stPosition?:number}} WBEntry */
    /** @typedef {{id:string, name:string, entryCount:number, enabledCount:number, tokenBudget:number|null}} WBBook */
    /** @typedef {{scanDepth:number, useLlmMatcher:boolean, budgetPercent:number, budgetCap:number}} WorldbookSettingsView */
    /** @typedef {{name:string, length:number, overridden:boolean}} PromptSummary */
    /** @typedef {{provider:'openai'|'mock', baseUrl:string, apiKey:string, model:string}} ApiConfigView */
    /** @typedef {{id:string, name:string, instruction:string}} ResponsePerspectiveOptionView */
    /** @typedef {{perspective:string, perspectives:ResponsePerspectiveOptionView[], lengthPreset:'card'|'short'|'medium'|'long'|'custom', minChars:number, maxChars:number, maxContextTokens:number}} ResponseSettingsView */
    /**
     * @typedef {Object} AgentTrace
     * @property {string} name
     * @property {string} inputJson
     * @property {string} outputJson
     * @property {string=} promptJson
     * @property {number} durationMs
     * @property {string} ts
     * @property {{promptTokens:number,completionTokens:number,totalTokens:number,calls:number,estimated:boolean,reused?:boolean,deferred?:boolean,reusedFromRunId?:string}} usage
     * @property {{promptTokens:number,completionTokens:number,totalTokens:number,calls:number,estimated:boolean}} usageTotal
     * @property {string} runId
     * @property {number} turn
     * @property {boolean} reroll
     */

    // ─── API helpers ──────────────────────────────────────────────────────
    async function apiGet(path) {
      const res = await fetch(path)
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`GET ${path} failed (${res.status}): ${t}`) }
      return res.json()
    }
    async function apiPost(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: body instanceof FormData
          ? {}
          : { 'Content-Type': 'application/json; charset=utf-8' },
        body: body instanceof FormData
          ? body
          : (typeof body === 'string' ? body : JSON.stringify(body)),
      })
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`POST ${path} failed (${res.status}): ${t}`) }
      return res.json()
    }
    async function apiPut(path, body) {
      const res = await fetch(path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`PUT ${path} failed (${res.status}): ${t}`) }
      return res.json()
    }
    async function apiPatch(path, body) {
      const res = await fetch(path, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`PATCH ${path} failed (${res.status}): ${t}`) }
      return res.json()
    }
    async function apiDelete(path) {
      const res = await fetch(path, { method: 'DELETE' })
      if (!res.ok) { const t = await res.text().catch(() => ''); throw new Error(`DELETE ${path} failed (${res.status}): ${t}`) }
      return res.json()
    }

    function fmtTime(iso) {
      if (!iso) return ''
      const d = new Date(iso)
      if (Number.isNaN(d.getTime())) return iso
      return d.toLocaleString()
    }

    function fmtTokens(value) {
      if (!Number.isFinite(Number(value))) return '—'
      return Number(value).toLocaleString()
    }

    function tokenLabel(usage) {
      if (!usage) return ''
      const suffix = usage.estimated ? ' 估算' : ''
      return `${fmtTokens(usage.totalTokens)} tok${suffix}`
    }

    const API_KEY_MASK = '***'

    // Keep the first paint useful before the settings request returns. The
    // server remains the source of truth; this only mirrors its defaults.
    const DEFAULT_RESPONSE_PERSPECTIVES = [
      { id: 'card', name: '跟随角色卡', instruction: '' },
      { id: 'first', name: '第一人称', instruction: '采用第一人称；用户扮演的角色使用“我”自称，只写该角色可知的感受与所见。' },
      { id: 'second', name: '第二人称', instruction: '采用第二人称沉浸视角，使用“你”指代用户扮演的角色，通过其感官营造在场感。' },
      { id: 'third', name: '第三人称有限', instruction: '采用第三人称有限视角，以用户角色的名字为主、他/她为辅；只写用户角色亲眼所见、亲耳所闻和亲身所感。' },
      { id: 'group', name: '第三人称群像', instruction: '采用第三人称群像视角；允许在相关角色之间自然切换，但保持叙事清晰，不替用户角色做未授权的关键决定。' },
    ]
    function mergeResponseSettings(value, previous) {
      const next = { ...previous, ...(value && typeof value === 'object' ? value : {}) }
      if (!Array.isArray(value?.perspectives)) next.perspectives = previous.perspectives
      return next
    }

    // SillyTavern's `chat_width` is a user-facing layout preference rather
    // than a character-card override. Keep the same idea here: the value
    // controls the shared message column, while the card's own HTML/CSS is
    // left untouched inside that column.
    const UI_SETTINGS_KEY = 'agent-rp-ui-settings-v1'
    const DEFAULT_UI_SETTINGS = Object.freeze({ chatWidth: 100 })
    function clampChatWidth(value) {
      const number = Number(value)
      if (!Number.isFinite(number)) return DEFAULT_UI_SETTINGS.chatWidth
      return Math.min(100, Math.max(25, Math.round(number)))
    }
    function readUiSettings() {
      try {
        const parsed = JSON.parse(localStorage.getItem(UI_SETTINGS_KEY) || '{}')
        return { chatWidth: clampChatWidth(parsed?.chatWidth) }
      } catch {
        return { ...DEFAULT_UI_SETTINGS }
      }
    }
    function writeUiSettings(value) {
      try { localStorage.setItem(UI_SETTINGS_KEY, JSON.stringify({ chatWidth: clampChatWidth(value.chatWidth) })) } catch { /* private mode */ }
    }

    function UiSettingsPanel(props) {
      const chatWidth = clampChatWidth(props.chatWidth)
      return h('div', { className: 'panel ui-settings-panel' },
        h('div', { className: 'panel-head' }, h('h2', null, '界面显示')),
        h('div', { className: 'hint' }, '参考 SillyTavern 的 Chat Width：只调整对话栏，不改角色卡自身的 HTML/CSS。'),
        h('label', { className: 'ui-range-field' },
          h('span', { className: 'ui-range-label' }, '对话宽度'),
          h('span', { className: 'ui-range-value' }, `${chatWidth}%`),
          h('input', {
            type: 'range', min: 25, max: 100, step: 1, value: chatWidth,
            onChange: (event) => props.onChatWidthChange(event.target.value),
            'aria-label': '对话宽度',
          }),
        ),
        h('div', { className: 'ui-range-scale' },
          h('span', null, '25%'), h('span', null, '窄'), h('span', null, '标准'), h('span', null, '100% 全宽'),
        ),
        h('div', { className: 'ui-width-presets' },
          [50, 75, 100].map((value) => h('button', {
            key: value, className: `mini${chatWidth === value ? ' active' : ''}`,
            onClick: () => props.onChatWidthChange(value),
          }, `${value}%`)),
        ),
        h('div', { className: 'ui-settings-actions' },
          h('button', { className: 'mini', onClick: () => props.onChatWidthChange(100), disabled: chatWidth === 100 }, '恢复全宽'),
        ),
        h('div', { className: 'hint' }, '正文、Markdown 和 HTML 美化会使用同一个对话宽度；角色卡内部的 max-width、边距和布局保持原样。'),
      )
    }

    // ─── Extension adapters panel ─────────────────────────────────────────
    // The upstream bundles are never auto-executed. The adapter shipped with
    // this app remains active; this panel only checks/downloads an allowlisted
    // upstream snapshot, matching ST's manual extension update workflow.
    function ExtensionsPanel(/** @type {{onError?: (e:string)=>void}} */ props) {
      const [extensions, setExtensions] = useState([])
      const [loading, setLoading] = useState(true)
      const [checking, setChecking] = useState(false)
      const [actionId, setActionId] = useState(null)
      const [error, setError] = useState(null)
      const refresh = useCallback(async () => {
        setLoading(true)
        try {
          const r = await apiGet('/api/extensions')
          setExtensions(Array.isArray(r.extensions) ? r.extensions : [])
        } catch (err) {
          const message = String(err.message || err)
          setError(message)
          props.onError?.(message)
        } finally { setLoading(false) }
      }, [props])
      useEffect(() => { void refresh() }, [refresh])
      const check = async () => {
        setChecking(true); setError(null)
        try {
          const r = await apiPost('/api/extensions/check', {})
          if (Array.isArray(r.extensions)) setExtensions(r.extensions)
        } catch (err) {
          const message = String(err.message || err)
          setError(message); props.onError?.(message)
        } finally { setChecking(false) }
      }
      const update = async (id) => {
        setActionId(id); setError(null)
        try {
          const r = await apiPost('/api/extensions/update', { id })
          if (r.status) setExtensions((prev) => prev.map((item) => item.id === id ? r.status : item))
        } catch (err) {
          const message = String(err.message || err)
          setError(message); props.onError?.(message)
        } finally { setActionId(null) }
      }
      const activate = async (id, version) => {
        setActionId(`${id}:${version}`); setError(null)
        try {
          const r = await apiPost('/api/extensions/activate', { id, version })
          if (r.status) setExtensions((prev) => prev.map((item) => item.id === id ? r.status : item))
        } catch (err) {
          const message = String(err.message || err)
          setError(message); props.onError?.(message)
        } finally { setActionId(null) }
      }
      const rollback = async (id) => {
        setActionId(`${id}:rollback`); setError(null)
        try {
          const r = await apiPost('/api/extensions/rollback', { id })
          if (r.status) setExtensions((prev) => prev.map((item) => item.id === id ? r.status : item))
        } catch (err) {
          const message = String(err.message || err)
          setError(message); props.onError?.(message)
        } finally { setActionId(null) }
      }
      const statusLabel = (item) => item.adapterStatus === 'update-available'
        ? '有更新' : item.adapterStatus === 'installed' ? '已安装' : item.adapterStatus === 'error' ? '检查失败' : '内置适配器'
      return h('div', { className: 'panel extensions-panel' },
        h('div', { className: 'panel-head' },
          h('h2', null, '扩展兼容层'),
          h('button', { className: 'mini', onClick: check, disabled: checking || loading }, checking ? '检查中…' : '检查更新'),
        ),
        h('div', { className: 'hint' }, '底层适配酒馆助手与提示词模板；更新只在你点击“手动更新”后下载，不会在启动时偷偷替换运行时代码。'),
        loading
          ? h('div', { className: 'list-empty' }, '加载中…')
          : h('div', { className: 'extension-list' }, extensions.map((item) => h('div', { key: item.id, className: 'extension-card' },
              h('div', { className: 'extension-card-head' },
                h('div', null,
                  h('div', { className: 'name' }, item.displayName),
                  h('div', { className: 'sub' }, item.repository),
                ),
                h('span', { className: `badge extension-status-${item.adapterStatus}` }, statusLabel(item)),
              ),
              h('div', { className: 'extension-meta' },
                h('span', null, `适配器 ${item.adapterVersion}`),
                h('span', null, `上游 ${item.availableVersion || item.installedVersion || '未检查'}`),
                item.activeVersion ? h('span', null, `当前 ${item.activeVersion}`) : null,
              ),
              h('div', { className: 'hint' }, (item.capabilities || []).join(' · ')),
              h('div', { className: 'row extension-actions' },
                h('a', { href: item.homePage, target: '_blank', rel: 'noreferrer' }, '打开上游'),
                h('button', {
                  className: 'mini', onClick: () => { void update(item.id) },
                  disabled: actionId !== null || item.adapterStatus === 'installed' && item.availableVersion === item.installedVersion,
                }, actionId === item.id ? '下载中…' : '手动更新'),
                h('button', {
                  className: 'mini', onClick: () => { void rollback(item.id) },
                  disabled: actionId !== null || !Array.isArray(item.versions) || item.versions.length < 2,
                  title: '切换到最近一次安装的其他版本',
                }, actionId === `${item.id}:rollback` ? '回滚中…' : '回滚'),
              ),
              Array.isArray(item.versions) && item.versions.length > 0
                ? h('div', { className: 'extension-versions' },
                    h('span', { className: 'hint' }, '已保存版本：'),
                    ...item.versions.map((version) => h('button', {
                      key: version.version, className: `mini${item.activeVersion === version.version ? ' active' : ''}`,
                      disabled: actionId !== null || item.activeVersion === version.version,
                      onClick: () => { void activate(item.id, version.version) },
                      title: `激活 ${version.version}`,
                    }, item.activeVersion === version.version ? `${version.version}（当前）` : version.version)),
                  )
                : null,
            ))),
        error ? h('div', { className: 'error-banner' }, error) : null,
      )
    }

    // ─── API config panel ─────────────────────────────────────────────────
    function ApiConfigPanel(/** @type {{onConfigChange?: () => void}} */ props) {
      const [cfg, setCfg] = useState(/** @type {ApiConfigView} */({
        provider: 'mock', baseUrl: 'https://api.openai.com/v1', apiKey: API_KEY_MASK, model: 'mock-model',
      }))
      const [models, setModels] = useState([])
      const [loading, setLoading] = useState(false)
      const [error, setError] = useState(null)
      const [hasSavedKey, setHasSavedKey] = useState(false)
      const [responseSettings, setResponseSettings] = useState(/** @type {ResponseSettingsView} */({
        perspective: 'card', perspectives: DEFAULT_RESPONSE_PERSPECTIVES, lengthPreset: 'card', minChars: 500, maxChars: 900, maxContextTokens: 32768,
      }))
      const [responseSaving, setResponseSaving] = useState(false)
      const responseSettingsLoaded = useRef(false)
      const responseSaveTimer = useRef(null)
      const responseLatestSaved = useRef('')
      // ⑤ 后处理设置 + SillyTavern 风格的可保存 preset
      const [ppSettings, setPpSettings] = useState({
        enabled: true, maxRounds: 2, densityMax: 0.6, deferExtract: true,
        modelOverrides: {}, activePresetId: 'default', presets: [],
      })
      const [ppSaving, setPpSaving] = useState(false)
      const [ppPresetName, setPpPresetName] = useState('')
      // MVU 是独立的正文后分析调用：单独模型、温度和 generation preset。
      const [mvuSettings, setMvuSettings] = useState({
        enabled: true, model: '', temperature: 0, promptName: 'mvu', activePresetId: 'default', presets: [],
      })
      const [mvuSaving, setMvuSaving] = useState(false)
      const [mvuPresetName, setMvuPresetName] = useState('')
      const applyPpSettingsResponse = (value) => {
        if (value && typeof value === 'object') setPpSettings((prev) => ({ ...prev, ...value }))
      }
      useEffect(() => {
        (async () => {
          try {
            const r = await apiGet('/api/postprocess-settings')
            applyPpSettingsResponse(r)
          } catch { /* ignore */ }
        })()
      }, [currentSessionId])
      useEffect(() => {
        (async () => {
          try {
            const r = await apiGet('/api/mvu-settings')
            if (r && typeof r === 'object') setMvuSettings((prev) => ({ ...prev, ...r }))
          } catch (err) { setError(String(err.message || err)) }
        })()
      }, [currentSessionId])
      useEffect(() => {
        (async () => {
          try {
            const r = await apiGet('/api/response-settings')
            if (r && typeof r === 'object') {
              setResponseSettings((prev) => {
                const next = mergeResponseSettings(r, prev)
                responseLatestSaved.current = JSON.stringify(next)
                return next
              })
            }
            responseSettingsLoaded.current = true
          } catch (err) { setError(String(err.message || err)) }
        })()
      }, [])
      const ppPayload = (overrides = {}) => ({
        enabled: ppSettings.enabled,
        maxRounds: ppSettings.maxRounds,
        densityMax: ppSettings.densityMax,
        deferExtract: ppSettings.deferExtract,
        modelOverrides: ppSettings.modelOverrides || {},
        ...overrides,
      })
      const savePpSettings = async (overrides = {}) => {
        setPpSaving(true)
        try {
          const r = await apiPut('/api/postprocess-settings', ppPayload(overrides))
          applyPpSettingsResponse(r)
        } catch (err) { setError(String(err.message || err)) }
        finally { setPpSaving(false) }
      }
      const togglePostprocess = () => {
        const next = !ppSettings.enabled
        setPpSettings((prev) => ({ ...prev, enabled: next }))
        void savePpSettings({ enabled: next })
      }
      const updatePp = (key, value) => setPpSettings((prev) => ({ ...prev, [key]: value }))
      const updatePpModel = (key, value) => setPpSettings((prev) => ({
        ...prev, modelOverrides: { ...(prev.modelOverrides || {}), [key]: value },
      }))
      const selectPpPreset = async (id) => {
        if (!id) return
        setPpSaving(true)
        try { applyPpSettingsResponse(await apiPut('/api/postprocess-settings', { presetId: id })) }
        catch (err) { setError(String(err.message || err)) }
        finally { setPpSaving(false) }
      }
      const savePpPreset = async () => {
        const name = ppPresetName.trim()
        if (!name) { setError('请输入预设名称。'); return }
        setPpSaving(true)
        try {
          const current = await apiPut('/api/postprocess-settings', ppPayload())
          applyPpSettingsResponse(current)
          applyPpSettingsResponse(await apiPost('/api/postprocess-presets', { name }))
          setPpPresetName('')
        } catch (err) { setError(String(err.message || err)) }
        finally { setPpSaving(false) }
      }
      const overwritePpPreset = async () => {
        if (!ppSettings.activePresetId) return savePpPreset()
        setPpSaving(true)
        try {
          const current = await apiPut('/api/postprocess-settings', ppPayload())
          applyPpSettingsResponse(current)
          applyPpSettingsResponse(await apiPut(`/api/postprocess-presets/${encodeURIComponent(ppSettings.activePresetId)}`, {}))
        } catch (err) { setError(String(err.message || err)) }
        finally { setPpSaving(false) }
      }
      const deletePpPreset = async () => {
        if (!ppSettings.activePresetId || ppSettings.activePresetId === 'default') return
        setPpSaving(true)
        try { applyPpSettingsResponse(await apiDelete(`/api/postprocess-presets/${encodeURIComponent(ppSettings.activePresetId)}`)) }
        catch (err) { setError(String(err.message || err)) }
        finally { setPpSaving(false) }
      }
      const updateMvu = (key, value) => setMvuSettings((prev) => ({ ...prev, [key]: value }))
      const applyMvuSettings = async (overrides = {}) => {
        setMvuSaving(true)
        try {
          const r = await apiPut('/api/mvu-settings', {
            enabled: mvuSettings.enabled,
            model: mvuSettings.model,
            temperature: mvuSettings.temperature,
            promptName: mvuSettings.promptName,
            ...overrides,
          })
          if (r && typeof r === 'object') setMvuSettings((prev) => ({ ...prev, ...r }))
        } catch (err) { setError(String(err.message || err)) }
        finally { setMvuSaving(false) }
      }
      const selectMvuPreset = async (id) => {
        if (!id) return
        setMvuSaving(true)
        try {
          const r = await apiPut('/api/mvu-settings', { presetId: id })
          if (r && typeof r === 'object') setMvuSettings((prev) => ({ ...prev, ...r }))
        } catch (err) { setError(String(err.message || err)) }
        finally { setMvuSaving(false) }
      }
      const saveMvuPreset = async () => {
        const name = mvuPresetName.trim()
        if (!name) { setError('请输入 MVU 预设名称。'); return }
        setMvuSaving(true)
        try {
          await applyMvuSettings()
          const r = await apiPost('/api/mvu-presets', { name })
          if (r && typeof r === 'object') setMvuSettings((prev) => ({ ...prev, ...r }))
          setMvuPresetName('')
        } catch (err) { setError(String(err.message || err)) }
        finally { setMvuSaving(false) }
      }
      const overwriteMvuPreset = async () => {
        if (!mvuSettings.activePresetId) return saveMvuPreset()
        setMvuSaving(true)
        try {
          await applyMvuSettings()
          const r = await apiPut(`/api/mvu-presets/${encodeURIComponent(mvuSettings.activePresetId)}`, {})
          if (r && typeof r === 'object') setMvuSettings((prev) => ({ ...prev, ...r }))
        } catch (err) { setError(String(err.message || err)) }
        finally { setMvuSaving(false) }
      }
      const deleteMvuPreset = async () => {
        if (!mvuSettings.activePresetId || mvuSettings.activePresetId === 'default') return

    // ─── Agent progress with expandable I/O trace ──────────────────────────
    // ⑤ postprocess 的正文链路是 4 个同步 stage；⑤.3 意象抽取在后台异步执行，
    // 不阻塞 final，也不再让当前请求一直显示 extract 处理中。
    // 不再用写死的 STAGE_ORDER,而是根据收到过的 stage 事件实时生成。
    const TOP_LEVEL_STAGES = ['intent', 'worldbook', 'context', 'response', 'mvu', 'summarize']
    const STAGE_LABELS = {
      intent: '① 意图识别', worldbook: '2.1 世界书匹配', context: '2.2 上下文处理',
      response: '③ 输出回复', mvu: 'MVU 变量处理(独立)', summarize: '④ 摘要(异步)',
      'postprocess-gate': '⑤.0 关键词门',
      'postprocess-pass-a': '⑤.1A 扩写张力',
      'postprocess-pass-b': '⑤.1B 感官去重',
      'postprocess-pass-c': '⑤.1C 密度收尾',
      'postprocess-extract': '⑤.3 意象抽取',
    }
    const INITIAL_STAGES = Object.fromEntries(TOP_LEVEL_STAGES.map(s => [s, 'pending']))

    function parseSseBuffer(buf) {
      const events = []
      const parts = buf.split('\n\n')
      const rest = parts.pop() || ''
      for (const block of parts) {
        if (block.length === 0) continue
        let evt = 'message'
        const dataLines = []
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) evt = line.slice(7).trim()
          else if (line.startsWith('data: ')) dataLines.push(line.slice(6))
          else if (line.startsWith('data:')) dataLines.push(line.slice(5))
        }
        if (dataLines.length > 0) events.push({ event: evt, data: dataLines.join('\n') })
      }
      return { events, rest }
    }

    // ─── 聊天消息的 HTML 安全渲染(酒馆卡的状态栏/内嵌 HTML) ────────────────
    // 白名单净化:DOMParser 解析后逐节点过滤。script/iframe/object/embed 一律剥掉,
    // on* 事件属性与 javascript: URL 剥掉;<style> 保留(酒馆状态栏大量依赖内联样式,
    // 与 SillyTavern 行为一致——样式作用于整个文档,本地单用户场景可接受)。
    const ALLOWED_TAGS = new Set(['DIV','SPAN','P','BR','HR','B','STRONG','I','EM','U','S','SMALL','H1','H2','H3','H4','H5','H6','UL','OL','LI','DL','DT','DD','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','CAPTION','COLGROUP','COL','IMG','FONT','A','CODE','PRE','BLOCKQUOTE','DETAILS','SUMMARY','STYLE','CENTER','SECTION','ARTICLE','HEADER','FOOTER','FIGURE','FIGCAPTION','SUB','SUP','MARK','PROGRESS','METER'])
    const ALLOWED_ATTRS = new Set(['style','class','src','alt','width','height','align','colspan','rowspan','href','title','bgcolor','color','size','face','dir','open','value','max','min','id'])

    function sanitizeHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html')
      const walk = (node) => {
        for (const child of [...node.childNodes]) {
          if (child.nodeType === Node.ELEMENT_NODE) {
            const tag = child.tagName
            if (!ALLOWED_TAGS.has(tag)) {
              // 危险/未知标签:保留其子文本,丢弃标签本身(script/style 内容除外,直接整树丢)
              if (tag === 'SCRIPT' || tag === 'IFRAME' || tag === 'OBJECT' || tag === 'EMBED' || tag === 'LINK' || tag === 'META' || tag === 'BASE') {
                child.remove(); continue
              }
              const frag = doc.createDocumentFragment()
              while (child.firstChild) frag.appendChild(child.firstChild)
              node.replaceChild(frag, child)
              walk(frag); continue
            }
            for (const attr of [...child.attributes]) {
              const name = attr.name.toLowerCase()
              if (name.startsWith('on') || !ALLOWED_ATTRS.has(name)) child.removeAttribute(attr.name)
              else if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) child.removeAttribute(attr.name)
            }
            walk(child)
          } else if (child.nodeType === Node.COMMENT_NODE) {
            child.remove()
          }
        }
      }
      walk(doc.body)
      return doc.body.innerHTML
    }

    // Character-card Regex output often arrives as a Markdown fence or as a
    // body-only document. Normalize those display forms before parsing the
    // card into the iframe document, while the outer message remains the
    // SillyTavern-style single scrolling surface.
    function normalizeCardFrontendSource(value) {
      let source = String(value || '').trim()
      const fenced = source.match(/^ {0,3}(\x60{3,}|~{3,})[^\r\n]*[\r\n]+([\s\S]*?)[\r\n]+ {0,3}\1[ \t]*$/u)
      if (fenced) source = String(fenced[2] || '').trim()
      const body = source.match(/^<body(?:\s[^>]*)?>([\s\S]*)<\/body>\s*$/iu)
      return body ? String(body[1] || '').trim() : source
    }

    // Ported from JS-Slash-Runner's iframe renderer.  SillyTavern does not
    // invent a card layout here: it gives the frontend a clean document
    // boundary, removes iframe-local scrollbars, and lets the card decide
    // its own visual layout.  Only min-height values expressed in vh are
    // redirected to the extension viewport variable, matching the upstream
    // replaceVhInContent behavior.
    function replaceCardViewportMinHeight(value) {

    function postCardHostEvent(frame, eventName, args = []) {
      if (!frame?.contentWindow || !frame.id || !eventName) return
      try {
        frame.contentWindow.postMessage({
          type: 'agent-rp-card-host-event',
          id: frame.id,
          eventName: String(eventName),
          args: Array.isArray(args) ? args : [],
        }, '*')
      } catch { /* a frame may be unloading */ }
    }

    function broadcastCardHostEvent(sessionId, eventName, ...args) {
      const expectedSession = sessionId === null || sessionId === undefined ? '' : String(sessionId)
      for (const frame of document.querySelectorAll('iframe.msg-card-html-frame')) {
        if (expectedSession && frame.dataset.sessionId !== expectedSession) continue
        postCardHostEvent(frame, eventName, args)
      }
    }

    async function prepareCardHostInjections(sessionId) {
      const expectedSession = sessionId === null || sessionId === undefined ? '' : String(sessionId)
      const frames = [...document.querySelectorAll('iframe.msg-card-html-frame')]
        .filter(frame => !expectedSession || frame.dataset.sessionId === expectedSession)
        .filter(frame => frame.contentWindow && frame.id)
      if (frames.length === 0) return
      const results = await new Promise((resolve) => {
        const expected = new Set(frames.map(frame => frame.id))
        const filters = new Map()
        let hasFunctionFilter = false
        let timer
        const finish = () => {
          clearTimeout(timer)
          window.removeEventListener('message', onMessage)
          resolve({ hasFunctionFilter, filters: [...filters.values()] })
        }
        const onMessage = (event) => {
          if (!event.source || !event.data || event.data.type !== 'agent-rp-card-injection-filter-result') return
          if (!expected.has(event.data.id)) return
          const frame = frames.find(item => item.id === event.data.id)
          if (frame && event.source !== frame.contentWindow) return
          expected.delete(event.data.id)
          hasFunctionFilter = hasFunctionFilter || event.data.hasFilters === true
          for (const item of Array.isArray(event.data.filters) ? event.data.filters : []) {
            if (typeof item?.scriptId !== 'string' || typeof item?.promptId !== 'string' || typeof item?.enabled !== 'boolean') continue
            filters.set(`${item.scriptId}\u0000${item.promptId}`, {
              scriptId: item.scriptId,
              promptId: item.promptId,
              enabled: item.enabled,
            })
          }
          // A frame with no local filter answers synchronously. Waiting for
          // all loaded frames still adds no material delay, while avoiding a
          // race where a later floor owns the actual function-valued filter.
          if (expected.size === 0) finish()
        }
        window.addEventListener('message', onMessage)
        timer = setTimeout(finish, 500)
        for (const frame of frames) {
          try {
            frame.contentWindow.postMessage({ type: 'agent-rp-card-prepare-generation', id: frame.id }, '*')
          } catch {
            // A card iframe can disappear between the query and the postMessage.
            // Treat it as having no local filter instead of leaving the handshake
            // waiting for the timeout.
            expected.delete(frame.id)
          }
        }
        if (expected.size === 0) finish()
      })
      if (!results?.hasFunctionFilter || !Array.isArray(results.filters) || results.filters.length === 0) return
      try {
        await apiPut(`/api/sessions/${encodeURIComponent(String(sessionId))}/tavern-helper`, {
          format: 0,
          operation: 'update-injection-filters',
          filters: results.filters,
        })
      } catch (error) {
        console.warn('[agent-rp Tavern Helper filter]', error)
      }
    }

        className: 'msg-card-html-frame',
        title: '角色卡 HTML 美化内容',
        // Tavern Helper's predefine/parent_jquery layer is a same-origin
        // parent bridge. Keep scripts sandboxed, but allow same-origin so
        // the parent can perform the same height-observer fallback when a
        // card's first postMessage happens before React subscribes.
        sandbox: 'allow-scripts allow-same-origin',
        scrolling: 'no',
        srcDoc: frameDocument,
        'data-card-surface': surfaceKind,
        'data-session-id': sessionId || '',
        onLoad: notifyFrameReady,
        style: { height: `${height}px` },
      })
    }

    function displaySourceLines(value) {
      const lines = []
      const re = /[^\r\n]*(?:\r\n|\r|\n|$)/gu
      for (const match of value.matchAll(re)) {
        const text = match[0]
        const start = match.index
        if (text === '' && start === value.length) break
        lines.push({ start, end: start + text.length, text })
      }
      return lines
    }

    // 角色卡前端不一定包在完整的 <html> 文档里。很多 ST 卡会通过
    // Regex 直接生成 <div class="card">...</div> 片段；这类片段若先交给
    // marked，<style> 会被当作 Markdown 内容拆坏，最终只剩普通文字。
    function hasCardFrontendMarkup(source) {
      return /<!doctype\s+html\b|<html(?:\s|>)|<(?:head|body|style|script|link|div|section|article|main|header|footer|nav|aside|details|summary|table|form|button|canvas|svg|h[1-6])(?:\s|>)/iu.test(source)
    }

    function isCardFrontendFragment(source) {
      const trimmed = String(source || '').trimStart()
      return /^(?:<!doctype\s+html\b|<html(?:\s|>)|<(?:head|body|style|script|link|div|section|article|main|header|footer|nav|aside|details|summary|table|form|button|canvas|svg|h[1-6])(?:\s|>))/iu.test(trimmed)
    }

    function isCardFrontendDocument(info, source) {
      const completeDocument = (/(?:<!doctype\s+html\b|<html(?:\s|>))\s*/iu.test(source)
        && /<\/html\s*>/iu.test(source))
      if (completeDocument) return true
      if (info.trim().split(/\s+/u)[0]?.toLowerCase() === 'html') return true
      // ST also treats common structural HTML fragments as frontend display
      // documents even when the author omitted the `html` fence language.
      return hasCardFrontendMarkup(source)
    }

    function compileDisplaySegments(value) {
      const lines = displaySourceLines(value)
      const segments = []
      let cursor = 0
      for (let i = 0; i < lines.length; i += 1) {
        const line = lines[i]
        const opening = line.text.match(/^ {0,3}(`{3,}|~{3,})[ \t]*([^\r\n]*?)[ \t]*(?:\r\n|\r|\n|$)/u)
        if (!opening) continue
        const marker = opening[1]
        let closingIndex = -1
        for (let j = i + 1; j < lines.length; j += 1) {
          const closing = lines[j].text.match(/^ {0,3}(`{3,}|~{3,})[ \t]*(?:\r\n|\r|\n|$)/u)
          if (closing && closing[1][0] === marker[0] && closing[1].length >= marker.length) {
            closingIndex = j; break
          }
        }
        if (closingIndex < 0) continue
        const closingLine = lines[closingIndex]
        const source = value.slice(line.end, closingLine.start)
        if (!isCardFrontendDocument(opening[2] || '', source)) continue
        const before = value.slice(cursor, line.start)
        if (before) segments.push({ kind: isCardFrontendFragment(before) ? 'html' : 'markdown', source: before })
        segments.push({ kind: 'html', source })
        cursor = closingLine.end
        i = closingIndex
      }
      const rest = value.slice(cursor)
      if (rest) {
        const hasFrontendMarkup = hasCardFrontendMarkup(rest)
        segments.push({ kind: hasFrontendMarkup && isCardFrontendFragment(rest) ? 'html' : 'markdown', source: rest })
      }
      return segments.length > 0 ? segments : [{ kind: 'markdown', source: value }]
    }

    /** 消息内容渲染:角色卡 display Regex → HTML/Markdown 分段 → 安全渲染。
     * 角色卡的 markdownOnly 脚本只影响显示，promptOnly 脚本不会污染显示；
     * 普通 Markdown 继续走 marked + 白名单净化，角色卡前端进入独立
     * iframe；iframe 只负责自身排版，滚动仍由外层 .chat 统一负责。 */
    function MessageContent({ content, role, character, sessionId = null, depth = 0, userName = '用户', mvuState = null, onVariablesChange = null }) {
      const processed = applyDisplayRegex(content, role === 'user' ? 1 : 2, character, depth, userName)
      const segments = compileDisplaySegments(processed)
      const rendered = segments.flatMap((segment, index) => {
        if (segment.kind === 'html') {
          return [h('div', { key: `html-surface-${index}`, className: 'msg-html-surface', 'data-surface-kind': 'content' },
            h(CardHtmlSurface, { source: segment.source, mvuState, character, sessionId, surfaceKind: 'content', onVariablesChange }),
          )]
        }
        const markdownHtml = marked.parse(segment.source, { gfm: true, breaks: true })
        return [h('div', { key: `md-${index}`, className: 'msg-markdown', dangerouslySetInnerHTML: { __html: sanitizeHtml(markdownHtml) } })]
      })
      return h('div', { className: 'msg-text msg-content-stack' }, rendered)
    }

    /**
     * SillyTavern-style message floor. The rendered message is only the
     * display surface; edit mode always exposes the original stored content
     * so card markers, regex placeholders and MVU blocks can be inspected or
     * corrected without losing them to the renderer.
     */
    function MessageFloor({
      message, index, total, character, sessionId, userName, mvuState, onVariablesChange,
      disabled = false, onReroll = null, onSwipe = null, onSaveEdit, onDelete,
    }) {
      const [collapsed, setCollapsed] = useState(false)
      const [editing, setEditing] = useState(false)
      const [draft, setDraft] = useState(message.content)
      const [saving, setSaving] = useState(false)
      const isLatestAssistant = index === total - 1 && message.role === 'assistant'

      useEffect(() => {
        if (!editing) setDraft(message.content)
      }, [message.content, editing])

      const save = async () => {
        setSaving(true)
        try {
          await onSaveEdit(index, draft)
          setEditing(false)
          setCollapsed(false)
        } finally {
          setSaving(false)
        }
      }

      const roleLabel = message.role === 'assistant' ? 'ASSISTANT' : message.role === 'user' ? 'USER' : 'SYSTEM'
      const preview = String(message.content || '').replace(/\s+/gu, ' ').trim().slice(0, 180)
      const floorStatus = collapsed ? ' floor-collapsed' : ''
      const swipes = Array.isArray(message.swipes) ? message.swipes : []
      const swipeId = Number.isInteger(message.swipe_id) ? message.swipe_id : 0
      const hasSwipes = message.role === 'assistant' && swipes.length > 1

      return h('div', { className: `msg floor-${message.role}${floorStatus}` },
        h('div', { className: 'floor-head' },
          h('button', {
            className: 'floor-toggle',
            title: collapsed ? '展开楼层' : '收起楼层',
            onClick: () => setCollapsed((value) => !value),
          }, collapsed ? '▸' : '▾'),
          h('span', { className: 'floor-index' }, `第 ${index + 1} 层`),
          h('span', { className: 'floor-role' }, roleLabel),
          collapsed ? h('span', { className: 'floor-preview', title: preview }, preview || '(空消息)') : null,
          h('div', { className: 'floor-actions' },
            hasSwipes
              ? h('span', { className: 'swipe-controls', role: 'group', 'aria-label': '切换本层回复' },
                  h('button', {
                    className: 'floor-action swipe-control', title: '上一条回复', disabled: disabled || swipeId <= 0,
                    onClick: () => { if (onSwipe) void onSwipe(index, swipeId - 1) },
                  }, '‹'),
                  h('span', { className: 'swipe-counter', 'aria-live': 'polite' }, `${swipeId + 1}/${swipes.length}`),
                  h('button', {
                    className: 'floor-action swipe-control', title: '下一条回复', disabled: disabled || swipeId >= swipes.length - 1,
                    onClick: () => { if (onSwipe) void onSwipe(index, swipeId + 1) },
                  }, '›'),
                )
              : null,
            h('button', {
              className: 'floor-action', title: editing ? '取消编辑' : '编辑本层', disabled: disabled || saving,
              onClick: () => { setEditing((value) => !value); setCollapsed(false) },
            }, editing ? '取消' : '编辑'),
            editing
              ? h('button', {
                  className: 'floor-action floor-action-primary', title: '保存本层', disabled: disabled || saving,
                  onClick: () => { void save() },
                }, saving ? '保存中…' : '保存')
              : null,
            isLatestAssistant && onReroll
              ? h('button', {
                  className: 'floor-action', title: '重 roll 当前回复', disabled: disabled,
                  onClick: () => { void onReroll() },
                }, '重 roll')
              : null,
            h('button', {
              className: 'floor-action floor-action-danger', title: '删除本层', disabled: disabled || saving,
              onClick: () => { void onDelete(index) },
            }, '删除'),
          ),
        ),
        editing
          ? h('div', { className: 'floor-editor' },
              h('textarea', {
                className: 'floor-editor-input', value: draft, disabled: saving,
                onChange: (event) => setDraft(event.target.value),
                spellCheck: false,
              }),
              h('div', { className: 'floor-editor-hint' }, '编辑的是原始楼层内容；保存后会重新应用角色卡正则、Markdown、HTML 与 MVU 展示。'),
            )
          : collapsed
            ? h('div', { className: 'floor-collapsed-body' }, preview || '(空消息)')
            : h(MessageContent, {
                content: message.content, role: message.role, character,
                sessionId, depth: Math.max(0, total - index - 1), userName, mvuState, onVariablesChange,
              }),
      )
    }

    /** 单个 stage 的可展开 trace 卡片。⑤ postprocess 的同步正文链路拆成独立 stage,
     *  每个 stage 都是独立卡片,不再嵌套 sub-trace。 */
    function StageTraceCard(/** @type {{name:string, status:string, trace: AgentTrace|null}} */ props) {
      const { name, status, trace } = props
      const [open, setOpen] = useState(false)
      const [tab, setTab] = useState(() => trace?.promptJson ? 'prompt' : 'output')
      const label = STAGE_LABELS[name] || name
      const payload = tab === 'prompt'
        ? trace?.promptJson
        : (tab === 'output' ? trace?.outputJson : trace?.inputJson)
      return h('div', { className: `stage-card stage-card-${status}` },
        h('div', { className: 'stage-card-head', onClick: () => setOpen((o) => !o) },
          h('span', { className: 'stage-card-dot' }),
          h('span', { className: 'stage-card-label' }, label),
          trace ? h('span', { className: 'stage-card-duration' }, `${trace.durationMs}ms`) : null,
          trace?.usageTotal ? h('span', { className: 'stage-card-tokens' }, tokenLabel(trace.usageTotal)) : null,
          trace?.reused ? h('span', { className: 'stage-card-reused' }, '复用') : null,
          h('span', { className: 'stage-card-status' }, status === 'done' ? '✓' : (status === 'error' ? '✗' : (status === 'running' ? '…' : '○'))),
          h('span', { className: 'stage-card-toggle' }, open ? '▾' : '▸'),
        ),
        open && trace ? h('div', { className: 'stage-card-body' },
          h('div', { className: 'stage-card-tabs' },
            h('button', { className: 'mini ' + (tab === 'output' ? 'active' : ''), onClick: () => setTab('output') }, '输出'),
            h('button', { className: 'mini ' + (tab === 'input' ? 'active' : ''), onClick: () => setTab('input') }, '输入'),
            trace?.promptJson ? h('button', { className: 'mini ' + (tab === 'prompt' ? 'active' : ''), onClick: () => setTab('prompt') }, '实际提示词') : null,
            trace && (trace.outputJson.length > 500 || trace.inputJson.length > 500)
              ? h('span', { className: 'hint', style: { marginLeft: 'auto' } }, 'JSON 可能很长,可滚动')
              : null,
          ),
          payload === undefined ? null : h('pre', { className: 'stage-card-payload' }, prettyJson(payload)),
        ) : null,
        open && !trace ? h('div', { className: 'stage-card-body hint' }, '(无 I/O,等待 stage 完成…)') : null,
      )
    }

    function prettyJson(s) {
      // 简单 pretty-print:把字符串用 JSON.parse 解析再 stringify(indent 2)
      // 如果解析失败(被截断),原样返回
      try { return JSON.stringify(JSON.parse(s), null, 2) } catch { return s }
    }

    /** 从当前 progressStages 里挑出所有 stage name,按"顶层 + 后处理子"顺序排:
     *   - 顶层:intent → worldbook → context → response → summarize
     *   - 后处理子:postprocess-gate → postprocess-pass-a → pass-b → pass-c
     *  实际跑的子集(看 progressStages 当前 key 集合),按这个固定顺序展示。 */
    function AgentProgress(/** @type {{stages: typeof INITIAL_STAGES, traces: Record<string, AgentTrace>}} */ { stages, traces }) {
      const allOrder = [
        'intent', 'worldbook', 'context', 'response', 'mvu',
        'postprocess-gate', 'postprocess-pass-a', 'postprocess-pass-b',
        'postprocess-pass-c', 'postprocess-extract',
        'summarize',
      ]
      const visible = allOrder.filter((n) => stages[n] !== undefined || traces[n] !== undefined)
      return h('div', { className: 'stage-traces' },
        h('div', { className: 'stage-traces-head' }, 'Agent 链路(点击展开 I/O)'),
        visible.map((name) => h(StageTraceCard, {
          key: name,
          name,
          status: stages[name] || 'pending',
          trace: traces[name] || null,
        })),
      )
    }

    // ─── Trace viewer:按轮回看持久化的 agent trace(traces.jsonl) ────────
    const TRACE_STAGE_ORDER = ['intent', 'worldbook', 'context', 'response', 'mvu']
    const TRACE_PREVIEW_CHARS = 500

    /** 单个 JSON payload 展示:pretty-print,超长默认截断 + "展开全部"。 */
    function TracePayload(/** @type {{jsonStr: string, expandKey: string, expanded: boolean, full?: boolean, onExpand: (k: string) => void}} */ props) {
      const pretty = prettyJson(props.jsonStr)
      if (props.full === true || pretty.length <= TRACE_PREVIEW_CHARS || props.expanded) {
        return h('pre', { className: 'stage-card-payload' }, pretty)
      }
      return h('div', null,
        h('pre', { className: 'stage-card-payload' }, pretty.slice(0, TRACE_PREVIEW_CHARS) + ` …(共 ${pretty.length} 字符,已截断)`),
        h('button', { className: 'mini', style: { marginTop: '2px' }, onClick: () => props.onExpand(props.expandKey) }, '展开全部'),
      )
    }

    /** 一轮里的单个 stage 卡片(持久化 trace 版,只读)。 */
    function TraceStageCard(/** @type {{trace: AgentTrace, traceKey: string}} */ props) {
      const [open, setOpen] = useState(false)
      const [tab, setTab] = useState(() => props.trace.promptJson ? 'prompt' : 'output')
      const [expandedAll, setExpandedAll] = useState(() => new Set())
      const t = props.trace
      const toggleAll = (k) => setExpandedAll((prev) => {
        const next = new Set(prev); if (next.has(k)) next.delete(k); else next.add(k); return next
      })
      const expandKey = `${props.traceKey}:${tab}`
      return h('div', { className: 'stage-card stage-card-done' },
        h('div', { className: 'stage-card-head', onClick: () => setOpen((o) => !o) },
          h('span', { className: 'stage-card-dot' }),
          h('span', { className: 'stage-card-label' }, STAGE_LABELS[t.name] || t.name),
          h('span', { className: 'stage-card-duration' }, `${t.durationMs}ms`),
          t.usageTotal ? h('span', { className: 'stage-card-tokens' }, tokenLabel(t.usageTotal)) : null,
          t.reused ? h('span', { className: 'stage-card-reused' }, '复用') : null,
          h('span', { className: 'stage-card-toggle' }, open ? '▾' : '▸'),
        ),
        open ? h('div', { className: 'stage-card-body' },
          h('div', { className: 'stage-card-tabs' },
            h('button', { className: 'mini ' + (tab === 'output' ? 'active' : ''), onClick: () => setTab('output') }, '输出'),
            h('button', { className: 'mini ' + (tab === 'input' ? 'active' : ''), onClick: () => setTab('input') }, '输入'),
            t.promptJson ? h('button', { className: 'mini ' + (tab === 'prompt' ? 'active' : ''), onClick: () => setTab('prompt') }, '实际提示词') : null,
            h('span', { className: 'hint', style: { marginLeft: 'auto' } }, fmtTime(t.ts)),
          ),
          h(TracePayload, {
            jsonStr: tab === 'prompt' ? t.promptJson : (tab === 'output' ? t.outputJson : t.inputJson),
            expandKey,
            expanded: expandedAll.has(expandKey),
            full: tab === 'prompt',
            onExpand: toggleAll,
          }),
        ) : null,
      )
    }

    /** Agent 追踪查看器:选会话 → GET /api/sessions/:id/traces → 按 turn 分组。 */
    function TracePanel(/** @type {{currentSessionId: string|null, refreshTick: number, onError: (e: string) => void}} */ props) {
      const [sessions, setSessions] = useState(/** @type {SessionInfo[]} */([]))
      const [selected, setSelected] = useState(null)
      const [traces, setTraces] = useState(/** @type {AgentTrace[]} */([]))
      const [turnStats, setTurnStats] = useState([])
      const [loading, setLoading] = useState(false)
      const [error, setError] = useState(null)
      const [expandedTurns, setExpandedTurns] = useState(() => new Set())

      const refreshSessions = useCallback(async () => {
        try {
          const r = await apiGet('/api/sessions')
          setSessions(r.sessions || [])
        } catch (err) { setError(String(err.message || err)) }
      }, [])

      useEffect(() => { void refreshSessions() }, [refreshSessions, props.refreshTick])

      // 跟随主界面当前会话切换
      useEffect(() => { if (props.currentSessionId !== null) setSelected(props.currentSessionId) }, [props.currentSessionId])

      const load = useCallback(async (sid) => {
        if (sid === null) { setTraces([]); setTurnStats([]); return }
        setLoading(true); setError(null)
        try {
          const r = await apiGet(`/api/sessions/${encodeURIComponent(sid)}/traces`)
          const list = /** @type {AgentTrace[]} */ (r.traces || [])
          setTraces(list)
          setTurnStats(r.turnStats || [])
          // 数据量大时只默认展开最后一次生成；runId 让同一 user turn 的重 roll 分开。
          const turns = [...new Set(list.map((t) => `${t.turn}:${t.runId || 'legacy'}`))]
          const lastTurn = turns.length > 0 ? turns[turns.length - 1] : null
          setExpandedTurns(lastTurn === null ? new Set() : new Set([lastTurn]))
        } catch (err) {
          setError(String(err.message || err)); setTraces([]); setTurnStats([])
        } finally { setLoading(false) }
      }, [])

      useEffect(() => { void load(selected) }, [selected, load, props.refreshTick])

      const toggleTurn = (k) => setExpandedTurns((prev) => {
        const next = new Set(prev); if (next.has(k)) next.delete(k); else next.add(k); return next
      })

      // 按 user turn + generation 分组；同一轮的重 roll 不与原回复混在一起。
      const runKey = (t) => `${t.turn}:${t.runId || 'legacy'}`
      const byTurn = new Map()
      for (const t of traces) {
        const k = runKey(t)
        if (!byTurn.has(k)) byTurn.set(k, [])
        byTurn.get(k).push(t)
      }
      const turnKeys = [...byTurn.keys()].reverse()

      return h('div', { className: 'panel' },
        h('h2', null, `Agent 追踪 (${traces.length})`),
        h('div', { className: 'field' },
          h('div', { className: 'row' },
            h('select', {
              value: selected ?? '', style: { flex: 1 },
              onChange: (e) => setSelected(e.target.value.length > 0 ? e.target.value : null),
            },
              h('option', { value: '' }, '— 选择会话 —'),
              ...sessions.map((s) => h('option', { key: s.sessionId, value: s.sessionId },
                `${s.label} · ${s.characterName} · ${s.turnCount}t`)),
            ),
            h('button', { onClick: () => { void load(selected) }, disabled: loading || selected === null, title: '重新拉取 traces' }, loading ? '…' : '↻'),
          ),
          h('div', { className: 'hint' }, '每轮 4 个 stage 的输入/输出落盘回看(刷新不丢);默认只展开最后一轮。'),
        ),
        error ? h('div', { className: 'error-banner' }, error) : null,
        selected === null
          ? h('div', { className: 'list-empty' }, '先选择一个会话')
          : traces.length === 0
            ? h('div', { className: 'list-empty' }, loading ? '加载中…' : '该会话暂无 trace(发一轮对话后生成)')
            : h('div', { className: 'trace-turns' },
                turnKeys.map((k) => {
                  const group = byTurn.get(k) || []
                  const runStat = turnStats.find((s) => s.runId === group[0]?.runId) || null
                  const turnNumber = group[0]?.turn ?? '—'
                  const ordered = [
                    ...group.filter((t) => TRACE_STAGE_ORDER.includes(t.name))
                      .sort((a, b) => TRACE_STAGE_ORDER.indexOf(a.name) - TRACE_STAGE_ORDER.indexOf(b.name)),
                    ...group.filter((t) => !TRACE_STAGE_ORDER.includes(t.name)),
                  ]
                  const totalMs = ordered.reduce((sum, t) => sum + (t.durationMs || 0), 0)
                  return h('div', { key: k, className: 'trace-turn' },
                    h('div', { className: 'trace-turn-head', onClick: () => toggleTurn(k) },
                      h('span', { className: 'trace-turn-toggle' }, expandedTurns.has(k) ? '▾' : '▸'),
                      h('span', { className: 'trace-turn-label' }, `第 ${turnNumber} 轮${runStat?.reroll ? ' · 重 roll' : ''}`),
                      h('span', { className: 'trace-turn-count' }, `${ordered.length} stage · ${totalMs}ms${runStat ? ` · 总 ${fmtTokens(runStat.total.totalTokens)} tok` : ''}`),
                    ),
                    expandedTurns.has(k) ? h('div', { className: 'trace-turn-stages' },
                      runStat ? h('div', { className: 'trace-token-summary' },
                        h('div', { className: 'trace-token-total' }, `本轮总计：${fmtTokens(runStat.total.totalTokens)} token${runStat.total.estimated ? '（估算）' : ''}`),
                        h('div', { className: 'trace-token-agents' },
                          Object.entries(runStat.agents || {}).map(([name, usage]) => h('span', { key: name, className: 'trace-token-agent' },
                            `${STAGE_LABELS[name] || name} ${tokenLabel(usage)}${usage.reused ? ' · 复用' : ''}${usage.deferred ? ' · 异步' : ''}`,
                          )),
                        ),
                      ) : null,
                      ordered.map((t, i) => h(TraceStageCard, { key: `${k}:${t.name}:${i}`, trace: t, traceKey: `${k}:${i}` })),
                    ) : null,
                  )
                }),
              ),
      )
    }

    // ─── 全局正则脚本(酒馆 Regex 扩展) ────────────────────────────────────
    // display 位在前端渲染时应用(不落库);user_input/ai_output 位由服务端应用。
    // 应用逻辑与 src/agent-loop/regex-scripts.ts 保持一致(前端无法 import ts,双实现)。
    let displayRegexScripts = /** @type {{id:string,scriptName:string,findRegex:string,replaceString:string,trimStrings:string[],placement:string[],disabled:boolean,markdownOnly:boolean,promptOnly:boolean,runOnEdit:boolean,substituteRegex:number,minDepth:number|null,maxDepth:number|null}[]} */([])
    function regexFromStringUI(input) {
      try {
        const literal = String(input).match(/^\/([\s\S]*)\/([a-z]*)$/iu)
        if (literal === null) return new RegExp(String(input))
        const flags = literal[2] || ''
        if (flags && !/^(?!.*?(.).*?\1)[dgimsuvy]+$/u.test(flags)) return new RegExp(String(input))
        return new RegExp(literal[1] || '', flags)
      } catch { return null }
    }
    function regexDepthUI(script, depth) {
      if (depth === undefined || depth === null) return true
      if (script.minDepth !== null && script.minDepth !== undefined && Number(script.minDepth) >= -1 && depth < Number(script.minDepth)) return false
      if (script.maxDepth !== null && script.maxDepth !== undefined && Number(script.maxDepth) >= 0 && depth > Number(script.maxDepth)) return false
      return true
    }
    function regexEscapeUI(value) {
      return String(value || '').replace(/[\\^$.*+?()\[\]{}|/\-]/g, '\\$&')
    }
    function expandRegexReplacementUI(template, match, captures, groups, offset, input, trimStrings, character, userName) {
      const prefix = input.slice(0, offset)
      const suffix = input.slice(offset + match.length)
      let replacement = String(template || '').replace(/\{\{match\}\}/giu, match)
      replacement = replacement.replace(/\$\$|\$&|\$`|\$'|\$\d{1,2}|\$<([^>]+)>/gu, (token, named) => {
        if (token === '$$') return '$'
        if (token === '$&') return match
        if (token === '$`') return prefix
        if (token === "$'") return suffix
        if (named !== undefined) {
          const captured = groups && groups[named]
          if (captured === undefined || captured === null) return ''
          let out = String(captured)
          for (const trim of (trimStrings || [])) if (trim) out = out.split(cardMacro(trim, character, userName)).join('')
          return out
        }
        const number = Number(token.slice(1))
        if (number === 0) return match
        const captured = captures[number - 1]
        if (captured === undefined || captured === null) return ''
        let out = String(captured)
        for (const trim of (trimStrings || [])) if (trim) out = out.split(cardMacro(trim, character, userName)).join('')
        return out
      })
      return cardMacro(replacement, character, userName)
    }
    function runRegexScriptUI(script, rawString, character = null, userName = '用户', depth = undefined) {
      if (script.disabled || !script.findRegex || !rawString) return rawString
      if (script.promptOnly && !script.markdownOnly) return rawString
      if (!regexDepthUI(script, depth)) return rawString
      const mode = Number(script.substituteRegex || 0)
      let findSource = String(script.findRegex)
      if (mode !== 0) {
        findSource = cardMacro(findSource, character, userName)
        if (mode === 2) findSource = regexEscapeUI(findSource)
      }
      const find = regexFromStringUI(findSource)
      if (!find) return rawString
      try {
        return rawString.replace(find, (...args) => {
          const last = args[args.length - 1]
          const groups = last && typeof last === 'object' ? last : undefined
          const input = String(groups === undefined ? last : args[args.length - 2] || rawString)
          const offsetIndex = groups === undefined ? args.length - 2 : args.length - 3
          const offset = typeof args[offsetIndex] === 'number' ? args[offsetIndex] : 0
          return expandRegexReplacementUI(script.replaceString, String(args[0] || ''), args.slice(1, offsetIndex), groups, offset, input, script.trimStrings, character, userName)
        })
      } catch { return rawString }
    }
    function cardMacro(value, character, userName = '用户') {
      const name = character && typeof character.name === 'string' ? character.name : ''
      return String(value || '')
        .replace(/\{\{char\}\}|<char>|<bot>/giu, name)
        .replace(/\{\{user\}\}|<user>/giu, userName)
    }
    function cardRegexFind(script, character, userName) {
      let find = String(script.findRegex || '')
      const mode = Number(script.substituteRegex || 0)
      if (mode === 1) find = cardMacro(find, character, userName)
      if (mode === 2) find = cardMacro(find, character, userName).replace(/[\\^$.*+?{}[\]\\/|()]/g, '\\$&')
      return find
    }
    function runCardRegexScriptUI(script, rawString, character, userName = '用户') {
      if (script.disabled || !script.findRegex || !rawString) return rawString
      const find = regexFromStringUI(cardRegexFind(script, character, userName))
      if (!find) return rawString
      try {
        return rawString.replace(find, (...args) => {
          const last = args[args.length - 1]
          const groups = last && typeof last === 'object' ? last : undefined
          const input = String(groups === undefined ? last : args[args.length - 2] || rawString)
          const offsetIndex = groups === undefined ? args.length - 2 : args.length - 3
          const offset = typeof args[offsetIndex] === 'number' ? args[offsetIndex] : 0
          return expandRegexReplacementUI(script.replaceString, String(args[0] || ''), args.slice(1, offsetIndex), groups, offset, input, script.trimStrings, character, userName)
        })
      } catch { return rawString }
    }
    function cardRegexInDepth(script, depth) {
      if (depth === undefined || depth === null) return true
      if (script.minDepth !== null && script.minDepth !== undefined && Number(script.minDepth) >= -1 && depth < Number(script.minDepth)) return false
      return script.maxDepth === null || script.maxDepth === undefined || Number(script.maxDepth) < 0 || depth <= Number(script.maxDepth)
    }
    function applyDisplayRegex(text, placement = 2, character = null, depth = undefined, userName = '用户') {
      let out = text
      for (const s of displayRegexScripts) {
        const markdownPlacement = s.markdownOnly && s.placement.includes(placement === 1 ? 'user_input' : 'ai_output')
        if (s.disabled || (!s.placement.includes('display') && !markdownPlacement)) continue
        out = runRegexScriptUI(s, out, character, userName, depth)
      }
      const scoped = character && character.frontend && Array.isArray(character.frontend.regexScripts)
        ? character.frontend.regexScripts : []
      const eligible = scoped.filter((s) => !s.disabled && Array.isArray(s.placement)
        && s.placement.includes(placement) && cardRegexInDepth(s, depth))
      // In SillyTavern's messageFormatting(..., isMarkdown: true) pass,
      // ordinary scoped scripts and promptOnly scripts do not run again.
      // They belong to the stored/prompt pipeline.  Running them here made
      // placeholders expand twice and was one source of misplaced HUD HTML.
      for (const s of eligible) {
        if (s.markdownOnly) out = runCardRegexScriptUI(s, out, character, userName)
      }
      return out
    }
    function refreshDisplayRegexScripts() {
      return apiGet('/api/regex').then((r) => { displayRegexScripts = r.scripts || [] }).catch(() => {})
    }

        setMarkdownOnly(s.markdownOnly === true); setPromptOnly(s.promptOnly === true); setRunOnEdit(s.runOnEdit === true); setSubstituteRegex(Number(s.substituteRegex || 0))
        setMinDepth(s.minDepth === null || s.minDepth === undefined ? '' : String(s.minDepth)); setMaxDepth(s.maxDepth === null || s.maxDepth === undefined ? '' : String(s.maxDepth)); setTestOut(null)

          replaceString: replace,
          trimStrings: trims.split('\n').map((s) => s.trim()).filter((s) => s.length > 0),
          placement: placements.length > 0 ? placements : ['display'],
          disabled: false,
          markdownOnly,
          promptOnly,
          runOnEdit,
          substituteRegex,
          minDepth: minDepth.trim() === '' ? null : Number(minDepth),
          maxDepth: maxDepth.trim() === '' ? null : Number(maxDepth),
        }
        setLoading(true)
        try {
          if (editingId === '') await apiPost('/api/regex', body)
          else if (editingId !== null) await apiPut(`/api/regex/${encodeURIComponent(editingId)}`, body)
          cancelEdit(); await refresh()
        } catch (err) { props.onError(String(err.message || err)) } finally { setLoading(false) }
      }, [editingId, name, find, replace, trims, placements, markdownOnly, promptOnly, runOnEdit, substituteRegex, minDepth, maxDepth, refresh, props])

      const toggleDisabled = useCallback(async (s) => {
        try {
          await apiPut(`/api/regex/${encodeURIComponent(s.id)}`, { disabled: !s.disabled })
          await refresh()
        } catch (err) { props.onError(String(err.message || err)) }
      }, [refresh, props])

      const remove = useCallback(async (s) => {
        if (!window.confirm(`删除正则「${s.scriptName}」?`)) return
        try { await apiDelete(`/api/regex/${encodeURIComponent(s.id)}`); await refresh() }
        catch (err) { props.onError(String(err.message || err)) }
      }, [refresh, props])

      const runTest = useCallback(async () => {
        if (testIn.length === 0) { setTestOut(null); return }
        try {
          const r = await apiPost('/api/regex-test', { text: testIn, placement: placements[0] || 'display' })
          setTestOut(r.result)
        } catch (err) { props.onError(String(err.message || err)) }
      }, [testIn, placements, props])

      const PLACEMENT_LABELS = { display: '显示', user_input: '用户输入', ai_output: 'AI输出', world_info: '世界书' }

      return h('div', { className: 'panel' },

              h('textarea', { placeholder: 'trim 串(每行一个,从捕获组内容中剥掉)', value: trims, onChange: (e) => setTrims(e.target.value), style: { minHeight: '36px' } }),

                  PLACEMENT_LABELS[p],

              h('div', { className: 'row', style: { flexWrap: 'wrap' } },
                h('label', { className: 'compact-check' }, h('input', { type: 'checkbox', checked: markdownOnly, onChange: (e) => setMarkdownOnly(e.target.checked) }), '仅显示（markdownOnly）'),
                h('label', { className: 'compact-check' }, h('input', { type: 'checkbox', checked: promptOnly, onChange: (e) => setPromptOnly(e.target.checked) }), '仅提示词（promptOnly）'),
                h('label', { className: 'compact-check' }, h('input', { type: 'checkbox', checked: runOnEdit, onChange: (e) => setRunOnEdit(e.target.checked) }), '编辑时执行'),
              ),
              h('div', { className: 'row', style: { flexWrap: 'wrap' } },
                h('label', { className: 'compact-field' }, '查找宏', h('select', { value: substituteRegex, onChange: (e) => setSubstituteRegex(Number(e.target.value)) },
                  h('option', { value: 0 }, '不替换'), h('option', { value: 1 }, '原样替换'), h('option', { value: 2 }, '转义替换'),
                )),
                h('label', { className: 'compact-field' }, '最小深度', h('input', { type: 'number', min: -1, value: minDepth, placeholder: '不限', onChange: (e) => setMinDepth(e.target.value) })),
                h('label', { className: 'compact-field' }, '最大深度', h('input', { type: 'number', min: 0, value: maxDepth, placeholder: '不限', onChange: (e) => setMaxDepth(e.target.value) })),
              ),
              h('div', { className: 'row' },
                h('button', { onClick: save, disabled: loading }, loading ? '保存中…' : '保存'),
                h('button', { onClick: cancelEdit }, '取消'),
              ),
              h('textarea', { placeholder: '试跑:粘贴样例文本…', value: testIn, onChange: (e) => { setTestIn(e.target.value); setTestOut(null) }, style: { minHeight: '36px' } }),
              h('div', { className: 'row' },
                h('button', { onClick: runTest }, '试跑'),
                testOut !== null ? h('span', { className: 'hint' }, '→') : null,
              ),
              testOut !== null ? h('pre', { className: 'hint', style: { whiteSpace: 'pre-wrap', margin: 0 } }, testOut) : null,
            )
          : h('button', { onClick: startCreate }, '+ 新建正则'),
        scripts.length === 0
          ? h('div', { className: 'list-empty' }, '还没有正则脚本')
          : h('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } },
              scripts.map((s) => h('div', { key: s.id, className: 'session-item' + (s.disabled ? '' : ' selected') },
                h('div', { className: 'session-item-main', style: { flex: 1, opacity: s.disabled ? 0.5 : 1 } },
                  h('div', { style: { fontWeight: 600, fontSize: '12px' } }, `${s.disabled ? '○' : '●'} ${s.scriptName}`),
                  h('div', { className: 'hint', style: { fontFamily: 'ui-monospace, monospace', fontSize: '10px' } },
                    `${s.findRegex.slice(0, 40)} → ${(s.replaceString || '(删除)').slice(0, 30)}`),
                  h('div', { className: 'hint' }, (s.placement || []).map((p) => PLACEMENT_LABELS[p] || p).join(' · ')),
                ),
                h('div', { className: 'session-actions' },
                  h('button', { title: s.disabled ? '启用' : '禁用', onClick: () => toggleDisabled(s), style: { fontSize: '10px', padding: '0 6px' } }, s.disabled ? '◻' : '◼'),
                  h('button', { title: '编辑', onClick: () => startEdit(s), style: { fontSize: '10px', padding: '0 6px' } }, '✎'),
                  h('button', { title: '删除', onClick: () => remove(s), style: { fontSize: '10px', padding: '0 6px' } }, '✕'),
                ),
              )),
            ),
      )
    }

      const [currentId, setCurrentId] = useState(/** @type {string|null} */(null))

      }, [])

      useEffect(() => { refresh() }, [refresh])
