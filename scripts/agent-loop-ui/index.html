            value: content,
            onChange: (e) => { setContent(e.target.value); setDirty(true) },
            spellCheck: false,
            style: { minHeight: '300px', fontFamily: 'ui-monospace, monospace', fontSize: '11px' },
          }),
          error ? h('div', { className: 'error-banner' }, error) : null,
        ) : null,
      )
    }

    // ─── Worldbooks panel (酒馆风格:按书分组) ────────────────────────────
    function WorldbooksPanel(/** @type {{currentCharacterId: string|null, onWorldbookChange: () => void, onError: (e:string)=>void}} */ props) {
      const fileRef = useRef(null)
      const [importedBooks, setImportedBooks] = useState(/** @type {WBBook[]} */([]))
      const [characterBook, setCharacterBook] = useState(/** @type {{name:string|null, entries: WBEntry[]}|null} */(null))
      const [wbConfig, setWbConfig] = useState(/** @type {{enabledBookIds: string[], disabledBookIds: string[], isDefault: boolean}|null} */(null))
      const [expandedBooks, setExpandedBooks] = useState(new Set())
      const [expandedEntries, setExpandedEntries] = useState(new Set())
      const [loading, setLoading] = useState(false)
      // 世界书全局设置(酒馆 world_info_depth:绿灯匹配扫描的最近消息条数)
      const [scanDepth, setScanDepth] = useState('2')
      const [matchMode, setMatchMode] = useState('enhanced')
      const [budgetPercent, setBudgetPercent] = useState('25')
      const [budgetCap, setBudgetCap] = useState('0')
      const [savingSettings, setSavingSettings] = useState(false)
      const scanDepthRef = useRef(null)

      const refreshSettings = useCallback(async () => {
        try {
          const r = await apiGet('/api/worldbook-settings')
          setScanDepth(String(r.scanDepth))
          setMatchMode(r.mode === 'strict' || r.mode === 'native' || r.mode === 'enhanced'
            ? r.mode
            : r.useLlmMatcher === false ? 'strict' : 'enhanced')
          setBudgetPercent(String(r.budgetPercent ?? 25))
          setBudgetCap(String(r.budgetCap ?? 0))
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props])
      useEffect(() => { refreshSettings() }, [refreshSettings])

      const saveSettings = useCallback(async () => {
        const n = Number.parseInt(scanDepth, 10)
        if (Number.isNaN(n) || n < 0 || n > 100) { props.onError('扫描深度必须是 0-100 的整数'); return }
        const percent = Number(budgetPercent)
        const cap = Number.parseInt(budgetCap, 10)
        if (!Number.isFinite(percent) || percent < 0 || percent > 100) { props.onError('世界书预算比例必须是 0-100'); return }
        if (Number.isNaN(cap) || cap < 0 || cap > 2000000) { props.onError('世界书绝对预算必须是 0-2000000 的整数'); return }
        setSavingSettings(true)
        try {
          const r = await apiPut('/api/worldbook-settings', { scanDepth: n, mode: matchMode, budgetPercent: percent, budgetCap: cap })
          setScanDepth(String(r.scanDepth))
          setMatchMode(r.mode || matchMode)
          setBudgetPercent(String(r.budgetPercent ?? percent))
          setBudgetCap(String(r.budgetCap ?? cap))
        } catch (err) { props.onError(String(err.message || err)) } finally { setSavingSettings(false) }
      }, [scanDepth, matchMode, budgetPercent, budgetCap, props])

      const refresh = useCallback(async () => {
        try {
          const r = await apiGet('/api/worldbooks')
          setImportedBooks(r.worldbooks || [])
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props])

      // 当前角色对每本独立世界书的启用状态(未选角色时为 null,不渲染开关)
      const refreshConfig = useCallback(async () => {
        if (props.currentCharacterId === null) { setWbConfig(null); return }
        try {
          const r = await apiGet(`/api/characters/${encodeURIComponent(props.currentCharacterId)}/worldbook-config`)
          setWbConfig({
            enabledBookIds: r.enabledBookIds || [],
            disabledBookIds: r.disabledBookIds || [],
            isDefault: r.isDefault === true,
          })
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props])

      useEffect(() => { refreshConfig() }, [refreshConfig, props.currentCharacterId])

      const toggleBookForCharacter = useCallback(async (bookId, next) => {
        if (props.currentCharacterId === null || wbConfig === null) return
        const disabled = new Set(wbConfig.disabledBookIds)
        if (next) disabled.delete(bookId)
        else disabled.add(bookId)
        try {
          await apiPut(`/api/characters/${encodeURIComponent(props.currentCharacterId)}/worldbook-config`, { disabledBookIds: [...disabled] })
          await refreshConfig()
          if (typeof props.onWorldbookChange === 'function') props.onWorldbookChange()
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props, wbConfig, refreshConfig])

      const deleteBook = useCallback(async (bookId) => {
        try {
          await apiDelete(`/api/worldbooks/${encodeURIComponent(bookId)}`)
          await refresh()
          if (typeof props.onWorldbookChange === 'function') props.onWorldbookChange()
        } catch (err) { props.onError(String(err.message || err)) }
      }, [refresh, props])

      const refreshCharacter = useCallback(async () => {
        if (props.currentCharacterId === null) { setCharacterBook(null); return }
        try {
          const r = await apiGet(`/api/characters/${encodeURIComponent(props.currentCharacterId)}/worldbook`)
          if (r.hasLorebook) {
            setCharacterBook({ name: r.lorebookName, entries: r.entries })
          } else {
            setCharacterBook({ name: null, entries: [] })
          }
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props])

      useEffect(() => { refresh() }, [refresh])
      useEffect(() => { refreshCharacter() }, [refreshCharacter, props.currentCharacterId])

      const toggleBook = (id) => setExpandedBooks((prev) => {
        const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next
      })
      const toggleEntry = (id) => setExpandedEntries((prev) => {
        const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next
      })

      const importJson = useCallback(async (text, name) => {
        setLoading(true)
        try {
          const qs = (typeof name === 'string' && name.length > 0) ? `?name=${encodeURIComponent(name)}` : ''
          const r = await apiPost(`/api/worldbook-import${qs}`, text)
          await refresh()
          setExpandedBooks((prev) => new Set([...prev, r.id]))
        } catch (err) { props.onError(String(err.message || err)) } finally { setLoading(false) }
      }, [refresh, props])

      const onUploadJson = (ev) => {
        const file = ev.target.files && ev.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = () => {
          const suggested = file.name.replace(/\.json$/i, '')
          const name = window.prompt('世界书名称(留空则使用文件内名称)', suggested)
          if (name === null) return
          importJson(String(reader.result || ''), name.trim())
        }
        reader.onerror = () => props.onError('读取 JSON 文件失败')
        reader.readAsText(file)
        ev.target.value = ''
      }

      const toggleEntryEnabled = useCallback(async (entry) => {
        if (props.currentCharacterId === null) return
        try {
          await apiPatch(
            `/api/characters/${encodeURIComponent(props.currentCharacterId)}/worldbook/${encodeURIComponent(entry.sourceId)}`,
            { enabled: !entry.enabled },
          )
          await refreshCharacter()
          if (typeof props.onWorldbookChange === 'function') props.onWorldbookChange()
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props, refreshCharacter])

      // 角色内嵌世界书 group
      const characterBookGroup = props.currentCharacterId === null
        ? h('div', { className: 'list-empty' }, '先选中一个角色')
        : characterBook === null
          ? h('div', { className: 'list-empty' }, '加载中…')
          : characterBook.entries.length === 0
            ? h('div', { className: 'list-empty' }, '该角色无内嵌世界书')
            : renderBookGroup(
                `character:${props.currentCharacterId}`,
                characterBook.name ?? '内嵌世界书',
                characterBook.entries,
                'character',
                expandedBooks, expandedEntries,
                toggleBook, toggleEntry, toggleEntryEnabled,
              )

      return h('div', { className: 'panel' },
        h('h2', null, `世界书库 (${(characterBook?.entries.length ?? 0) + importedBooks.reduce((s, b) => s + b.entryCount, 0)})`),
        h('div', { className: 'field' },
          h('div', { className: 'row' },
            h('button', { onClick: () => fileRef.current && fileRef.current.click(), disabled: loading }, '导入世界书 JSON'),
            h('input', { ref: fileRef, type: 'file', accept: 'application/json,.json', style: { display: 'none' }, onChange: onUploadJson }),
          ),
          h('div', { className: 'hint' }, '支持酒馆 World Info .json 格式;导入后自动展开。🔵=蓝灯(常驻注入) 🟢=绿灯(匹配激活)。'),
        ),
        // 世界书全局设置:绿灯扫描深度(酒馆 world_info_depth,默认 2)
        h('div', { className: 'field' },
          h('label', null, '绿灯处理模式与扫描深度'),
          h('div', { className: 'row' },
            h('select', {
              value: matchMode,
              onChange: (e) => setMatchMode(e.target.value),
              title: '普通绿灯条目的判断权;蓝灯和扩展特殊条目仍由兼容层处理',
            },
              h('option', { value: 'strict' }, 'ST strict：只用关键词'),
              h('option', { value: 'enhanced' }, 'ST enhanced：关键词 + agent'),
              h('option', { value: 'native' }, 'Agent native：只用 agent'),
            ),
            h('input', {
              ref: scanDepthRef, type: 'number', min: 0, max: 100, value: scanDepth,
              onChange: (e) => setScanDepth(e.target.value), style: { width: '90px' },
              title: '2.1 世界书匹配 agent 扫描最近 N 条消息(用户+角色都算);对应 SillyTavern 的 world_info_depth,默认 2',
            }),
            h('input', {
              type: 'number', min: 0, max: 100, step: 1, value: budgetPercent,
              onChange: (e) => setBudgetPercent(e.target.value), style: { width: '90px' },
              title: '对应 SillyTavern world_info_budget,占总上下文的百分比',
              placeholder: '预算%',
            }),
            h('input', {
              type: 'number', min: 0, max: 2000000, step: 256, value: budgetCap,
              onChange: (e) => setBudgetCap(e.target.value), style: { width: '100px' },
              title: '对应 SillyTavern world_info_budget_cap,0 表示不限',
              placeholder: '绝对上限',
            }),
            h('button', { onClick: saveSettings, disabled: savingSettings }, savingSettings ? '保存中…' : '保存'),
          ),
          h('div', { className: 'hint' }, '普通绿灯按所选模式处理;蓝灯 constant、EJS、@INJECT、[GENERATE]/[RENDER] 等扩展特殊条目始终由兼容层处理。预算按 ST 的 order 优先选择，ignoreBudget 条目不计入上限；enhanced 模式不会新增一次 LLM 调用。'),
        ),
        // 角色内嵌世界书(选中角色后才显示)
        characterBookGroup,
        // 独立世界书列表
        importedBooks.length === 0
          ? null
          : h('div', { className: 'worldbook-section' },
              h('div', { className: 'worldbook-section-label' }, '独立世界书'),
              wbConfig !== null
                ? h('div', { className: 'hint' }, '书名前的勾选框 = 当前角色是否启用这本独立世界书(只影响当前角色);条目级开关在展开后的书内,对所有角色生效。')
                : null,
              importedBooks.map((b) => {
                const charEnabled = wbConfig !== null ? !wbConfig.disabledBookIds.includes(b.id) : null
                return h(ImportedBookGroup, {
                  key: b.id, book: b,
                  expanded: expandedBooks.has(b.id),
                  expandedEntries,
                  charEnabled,
                  onToggleCharEnabled: (props.currentCharacterId !== null && charEnabled !== null)
                    ? () => toggleBookForCharacter(b.id, !(charEnabled === true))
                    : null,
                  onToggle: () => toggleBook(b.id),
                  onToggleEntry: toggleEntry,
                  onDelete: () => deleteBook(b.id),
                  onError: props.onError,
                  onWorldbookChange: props.onWorldbookChange,
                })
              }),
            ),
      )
    }

    function renderBookGroup(id, name, entries, source, expandedBooks, expandedEntries, toggleBook, toggleEntry, toggleEntryEnabled) {
      const enabledCount = entries.filter((e) => e.enabled).length
      const expanded = expandedBooks.has(id)
      return h('div', { key: id, className: 'book-group' },
        h('div', { className: 'book-head', onClick: () => toggleBook(id) },
          h('span', { className: 'book-toggle' }, expanded ? '▾' : '▸'),
          h('span', { className: 'book-name' }, name),
          h('span', { className: 'book-count' }, `${enabledCount}/${entries.length}`),
        ),
        expanded ? h('div', { className: 'book-entries' },
          entries.map((e) => h(BookEntryRow, {
            key: e.sourceId, entry: e, source,
            expanded: expandedEntries.has(e.sourceId),
            onToggleExpand: () => toggleEntry(e.sourceId),
            onToggleEnabled: source === 'character' ? () => toggleEntryEnabled(e) : null,
          })),
        ) : null,
      )
    }

    function ImportedBookGroup(/** @type {{book: WBBook, expanded: boolean, expandedEntries: Set<string>, charEnabled: boolean|null, onToggleCharEnabled: (()=>void)|null, onToggle: () => void, onToggleEntry: (id: string) => void, onDelete: () => void, onError: (e:string)=>void, onWorldbookChange: () => void}} */ props) {
      const [entries, setEntries] = useState(/** @type {WBEntry[]|null} */(null))
      const [loading, setLoading] = useState(false)
      const load = useCallback(async () => {
        setLoading(true)
        try {
          const r = await apiGet(`/api/worldbooks/${encodeURIComponent(props.book.id)}`)
          setEntries(r.entries || [])
        } catch (err) { props.onError(String(err.message || err)) } finally { setLoading(false) }
      }, [props.book.id, props])
      useEffect(() => { if (props.expanded && entries === null) load() }, [props.expanded, entries, load])
      const toggleEnabled = useCallback(async (entry) => {
        try {
          await apiPatch(`/api/worldbooks/${encodeURIComponent(props.book.id)}/entry/${encodeURIComponent(entry.sourceId)}`, { enabled: !entry.enabled })
          setEntries((prev) => prev === null ? prev : prev.map((e) => e.sourceId === entry.sourceId ? { ...e, enabled: !e.enabled } : e))
          if (typeof props.onWorldbookChange === 'function') props.onWorldbookChange()
        } catch (err) { props.onError(String(err.message || err)) }
      }, [props])
      return h('div', { className: 'book-group' },
        h('div', { className: 'book-head' + (props.charEnabled === false ? ' char-disabled' : ''), onClick: props.onToggle },
          props.onToggleCharEnabled !== null
            ? h('input', {
                type: 'checkbox', checked: props.charEnabled === true,
                title: '当前角色启用/禁用这本世界书',
                onClick: (e) => e.stopPropagation(),
                onChange: props.onToggleCharEnabled,
                style: { marginRight: '4px' },
              })
            : null,
          h('span', { className: 'book-toggle' }, props.expanded ? '▾' : '▸'),
          h('span', { className: 'book-name', title: props.book.tokenBudget === null || props.book.tokenBudget === undefined
            ? props.book.name : `来源书 token_budget: ${props.book.tokenBudget}` }, props.book.name),
          props.charEnabled === false ? h('span', { className: 'flag', title: '当前角色未启用这本世界书' }, '未启用') : null,
          h('span', { className: 'book-count' }, `${props.book.enabledCount}/${props.book.entryCount}`),
          h('button', {
            title: '删除这本世界书',
            onClick: (e) => {
              e.stopPropagation()
              if (window.confirm(`删除世界书「${props.book.name}」?此操作不可恢复。`)) props.onDelete()
            },
            style: { fontSize: '10px', padding: '0 6px', lineHeight: '18px' },
          }, '✕'),
        ),
        props.expanded ? h('div', { className: 'book-entries' },
          loading
            ? h('div', { className: 'hint' }, '加载中…')
            : entries === null
              ? h('div', { className: 'hint' }, '加载失败')
              : entries.map((e) => h(BookEntryRow, {
                  key: e.sourceId, entry: e, source: 'imported',
                  expanded: props.expandedEntries.has(e.sourceId),
                  onToggleExpand: () => props.onToggleEntry(e.sourceId),
                  onToggleEnabled: () => toggleEnabled(e),
                })),
        ) : null,
      )
    }

    /** ST position 枚举 → 前端标签(0-7,docs/st-adaptation-research.md §4)。 */
    function stPositionLabel(st) {
      const n = typeof st === 'number' ? st : (st === 'before_char' ? 0 : 1)
      return ['0 前(before)', '1 后(after)', '2 AN顶', '3 AN底', '4 深度', '5 例顶', '6 例底', '7 插座'][n] ?? String(n)
    }

    /** ST selectiveLogic → 前端标签(2.1 匹配 agent 的次关键词逻辑)。 */
    function selectiveLogicLabel(logic) {
      const map = {
        'and-any': 'AND_ANY 任一命中',
        'and-all': 'AND_ALL 全部命中',
        'not-any': 'NOT_ANY 全部未命中',
        'not-all': 'NOT_ALL 任一未命中',
      }
      return map[logic] ?? (logic || 'and-any')
    }

    function BookEntryRow(/** @type {{entry: WBEntry, source: 'character'|'imported', expanded: boolean, onToggleExpand: () => void, onToggleEnabled: (() => void)|null}} */ props) {
      const e = props.entry
      const keys = [...e.keys, ...e.secondaryKeys.map((k) => `+${k}`)].join(', ') || '—'
      const probability = typeof e.probability === 'number' ? e.probability : 100
      return h('div', { className: 'book-entry' + (e.enabled ? '' : ' disabled') },
        h('div', { className: 'book-entry-head' },
          props.onToggleEnabled !== null
            ? h('input', { type: 'checkbox', checked: e.enabled, onChange: props.onToggleEnabled, title: '启用/禁用', style: { marginRight: '4px' } })
            : h('span', { className: 'book-entry-dot', title: e.enabled ? '启用' : '禁用' }, e.enabled ? '●' : '○'),
          h('span', { className: 'book-entry-name', onClick: props.onToggleExpand, style: { cursor: 'pointer', flex: 1 } }, e.name ?? `(未命名 #${e.insertionOrder})`),
          e.constant
            ? h('span', { className: 'flag', title: '蓝灯(constant):无条件每轮常驻注入,不走关键词匹配' }, '🔵常驻')
            : h('span', { className: 'flag', title: '绿灯(keyed):由 2.1 匹配 agent 按最近消息+关键词语义判断激活' }, '🟢匹配'),
          probability < 100
            ? h('span', { className: 'flag', title: '激活概率:agent 选中后系统掷骰(Math.random()*100 <= p)' }, `${probability}%`)
            : null,
          h('span', { className: 'book-entry-toggle', onClick: props.onToggleExpand, style: { cursor: 'pointer' } }, props.expanded ? '▾' : '▸'),
        ),
        props.expanded ? h('div', { className: 'book-entry-body' },
          h('div', { className: 'book-entry-meta' },
            h('span', null, `插入顺序: ${e.insertionOrder}`),
            e.priority !== null ? h('span', null, ` · 优先级: ${e.priority}`) : null,
            h('span', null, ` · 位置: ${stPositionLabel(e.stPosition ?? e.position)}`),
            h('span', null, ` · 次关键词逻辑: ${selectiveLogicLabel(e.selectiveLogic)}`),
            h('span', null, ` · 概率: ${probability}%${e.useProbability === false ? '(关)' : ''}`),
            e.caseSensitive ? h('span', null, ' · 大小写敏感') : null,
            e.matchWholeWords ? h('span', null, ' · 整词匹配') : null,
            e.useRegex ? h('span', null, ' · 正则') : null,
          ),
          keys !== '—' ? h('div', { className: 'book-entry-keys' }, `关键词: ${keys}`) : null,
          h('pre', { className: 'book-entry-content' }, e.content || '(空)'),
        ) : null,
      )
    }

    // ─── Sessions panel:全局历史会话管理(打开/重命名/删除) ─────────────
    function SessionsPanel(/** @type {{currentSessionId: string|null, currentCharacterId: string|null, onOpenSession: (s: SessionInfo) => void, onSessionDeleted: (sid: string) => void, onError: (e: string) => void, refreshTick: number}} */ props) {
      const [sessions, setSessions] = useState(/** @type {SessionInfo[]} */([]))
      const [loading, setLoading] = useState(false)
      const [renaming, setRenaming] = useState(null) // 正在行内重命名的 sessionId
      const [renameText, setRenameText] = useState('')
      const propsRef = useRef(props); propsRef.current = props

      const refresh = useCallback(async () => {
        setLoading(true)
        try {
          const r = await apiGet('/api/sessions')
          setSessions(r.sessions || [])
        } catch (err) { propsRef.current.onError(String(err.message || err)) } finally { setLoading(false) }
      }, [])

      useEffect(() => { void refresh() }, [refresh, props.refreshTick])

      const rename = async (sid) => {
        const label = renameText.trim()
        if (label.length === 0) { setRenaming(null); return }
        try {
          await apiPatch(`/api/sessions/${encodeURIComponent(sid)}`, { label })
          setRenaming(null)
          await refresh()
        } catch (err) { propsRef.current.onError(String(err.message || err)) }
      }

      const remove = async (sid, label) => {
        if (!window.confirm(`删除会话「${label}」?聊天历史与 agent trace 一并删除,不可恢复。`)) return
        try {
          await apiDelete(`/api/sessions/${encodeURIComponent(sid)}`)
          propsRef.current.onSessionDeleted(sid)
          await refresh()
        } catch (err) { propsRef.current.onError(String(err.message || err)) }
      }

      return h('div', { className: 'panel' },
        h('div', { className: 'panel-head' },
          h('h2', null, `会话 (${sessions.length})`),
          h('button', { className: 'mini', onClick: () => { void refresh() }, disabled: loading, title: '刷新会话列表' }, loading ? '…' : '↻'),
        ),
        h('div', { className: 'hint' }, '全部角色的历史会话:点行打开,✎ 重命名,✕ 删除。'),
        sessions.length === 0
          ? h('div', { className: 'list-empty' }, '暂无会话')
          : h('div', { className: 'list' },
              sessions.map((s) => h('div', {
                key: s.sessionId,
                className: 'list-item session-item' + (s.sessionId === props.currentSessionId ? ' active' : ''),
                onClick: () => props.onOpenSession(s),
                title: `${s.characterName} · ${s.sessionId}`,
              },
                renaming === s.sessionId
                  ? h('div', { className: 'session-rename', onClick: (e) => e.stopPropagation() },
                      h('input', {
                        value: renameText, autoFocus: true, spellCheck: false,
                        onChange: (e) => setRenameText(e.target.value),
                        onKeyDown: (e) => {
                          if (e.key === 'Enter') { e.preventDefault(); void rename(s.sessionId) }
                          if (e.key === 'Escape') { e.preventDefault(); setRenaming(null) }
                        },
                        style: { fontSize: '12px' },
                      }),
                      h('button', { className: 'mini', onClick: () => { void rename(s.sessionId) }, title: '保存新名称' }, '存'),
                      h('button', { className: 'mini', onClick: () => setRenaming(null), title: '取消重命名' }, '✕'),
                    )
                  : h('div', { style: { minWidth: 0, flex: 1 } },
                      h('div', { className: 'name session-name' }, s.label),
                      h('div', { className: 'sub' }, `${s.characterName} · ${fmtTime(s.createdAt)}`),
                    ),
                renaming === s.sessionId
                  ? null
                  : h('div', { className: 'session-actions', onClick: (e) => e.stopPropagation() },
                      h('span', { className: 'badge', title: '对话轮数' }, `${s.turnCount}t`),
                      h('button', { className: 'mini', title: '重命名', onClick: () => { setRenaming(s.sessionId); setRenameText(s.label) } }, '✎'),
                      h('button', { className: 'mini', title: '删除', onClick: () => { void remove(s.sessionId, s.label) } }, '✕'),
                    ),
              )),
            ),
      )
    }

    // ─── App shell: SillyTavern-inspired icon rail + on-demand drawers ────
    const TOOL_DEFS = [
      { id: 'character', label: '角色', icon: '◉', side: 'right' },
      { id: 'sessions', label: '会话', icon: '☷', side: 'right' },
      { id: 'ui', label: '界面', icon: '▣', side: 'left' },
      { id: 'api', label: '模型', icon: '⚙', side: 'left' },
      { id: 'extensions', label: '扩展', icon: '◇', side: 'left' },
      { id: 'persona', label: 'Persona', icon: '☺', side: 'left' },
      { id: 'worldbooks', label: '世界书', icon: '▤', side: 'left' },
      { id: 'regex', label: '正则', icon: '⌁', side: 'left' },
      { id: 'import', label: '导入', icon: '↥', side: 'left' },
      { id: 'prompts', label: '提示词', icon: '✎', side: 'left' },
      { id: 'trace', label: 'Trace', icon: '⌘', side: 'left' },
    ]

    // ─── App ──────────────────────────────────────────────────────────────
    function App() {
      const [health, setHealth] = useState(null)
      const [characters, setCharacters] = useState([])
      const [currentCharacterId, setCurrentCharacterId] = useState(null)
      const [currentCharacter, setCurrentCharacter] = useState(null)
      const [currentUserName, setCurrentUserName] = useState('用户')
      const [mvuState, setMvuState] = useState(null)
      const [characterSessions, setCharacterSessions] = useState([])
      const [currentSessionId, setCurrentSessionId] = useState(null)
      const [history, setHistory] = useState([])
      const [userInput, setUserInput] = useState('')
      const [loading, setLoading] = useState(false)
      const [error, setError] = useState(null)
      const [progressStages, setProgressStages] = useState(INITIAL_STAGES)
      const [traces, setTraces] = useState({})
      const [lastTokenStats, setLastTokenStats] = useState(null)
      const [greetingIdx, setGreetingIdx] = useState(0)
      const [activeGreetingIdx, setActiveGreetingIdx] = useState(0)
      const [bootDone, setBootDone] = useState(false)
      const [activeTool, setActiveTool] = useState(null)
      const [uiSettings, setUiSettings] = useState(() => readUiSettings())
      const fileRef = useRef(null)
      const chatRef = useRef(null)
      const cardVariableWriteRef = useRef(Promise.resolve())
      const changeChatWidth = useCallback((value) => {
        setUiSettings((previous) => {
          const next = { ...previous, chatWidth: clampChatWidth(value) }
          writeUiSettings(next)
          return next
        })
      }, [])
      // 角色卡 iframe 里的 Tavern Helper/MVU 更新先回到宿主状态，再由
      // 后端持久化层决定是否写回当前 session。这样同一轮里所有楼层的
      // 状态栏会立即看到一致快照，不再只显示卡片初始化时的变量。
      const onCardVariablesChange = useCallback((next) => {
        const normalized = next?.stat_data ? next : { stat_data: next || {} }
        setMvuState(normalized)
        if (currentSessionId === null) return
        const sessionId = currentSessionId
        // Card scripts can emit several variable updates in one turn. Keep
        // their order, otherwise a slower HTTP request could overwrite a
        // newer snapshot after the card already rendered it.
        cardVariableWriteRef.current = cardVariableWriteRef.current
          .catch(() => undefined)
          .then(async () => {
            const response = await apiPut(`/api/sessions/${encodeURIComponent(sessionId)}/variables`, {
              format: 0,
              scope: 'chat',
              variables: normalized,
            })
            if (response?.mvuState !== undefined) setMvuState({ stat_data: response.mvuState })
          })
          .catch((err) => setError(`保存角色卡变量失败: ${String(err?.message || err)}`))
      }, [currentSessionId])
      useEffect(() => {
        (async () => {
          try {
            const state = await apiGet('/api/state')
            setCharacters(state.characters || [])
            setCurrentCharacterId(state.currentCharacterId)
            setCurrentSessionId(state.currentSessionId)
            try {
              const personaState = await apiGet('/api/personas')
              const currentPersona = (personaState.personas || []).find((persona) => persona.id === personaState.currentPersonaId)
              setCurrentUserName(currentPersona?.name || '用户')
            } catch { /* persona is optional; keep the ST-compatible fallback */ }
            if (state.currentCharacterId) {
              const detail = await apiGet(`/api/characters/${encodeURIComponent(state.currentCharacterId)}`)
              setCurrentCharacter(detail.character)
            }
            if (state.currentSessionId) {
              const hist = await apiGet(`/api/history?sessionId=${encodeURIComponent(state.currentSessionId)}`)
              setHistory(hist.history || [])
              setMvuState(hist.mvuState ?? null)
              setActiveGreetingIdx(Number.isInteger(hist.greetingIndex) ? hist.greetingIndex : 0)
              const traceData = await apiGet(`/api/sessions/${encodeURIComponent(state.currentSessionId)}/traces`)
              const stats = traceData.turnStats || []
              setLastTokenStats(stats[stats.length - 1] || null)
            }
            setHealth(await apiGet('/api/health'))
          } catch (err) { setError(String(err.message || err)) } finally { setBootDone(true) }
        })()
      }, [])

      useEffect(() => {
        if (!bootDone) return
        if (currentSessionId === null) { setHistory([]); setMvuState(null); setLastTokenStats(null); return }
        (async () => {
          try {
            const r = await apiGet(`/api/history?sessionId=${encodeURIComponent(currentSessionId)}`)
            setHistory(r.history || [])
            setMvuState(r.mvuState ?? null)
            setActiveGreetingIdx(Number.isInteger(r.greetingIndex) ? r.greetingIndex : 0)
            const traceData = await apiGet(`/api/sessions/${encodeURIComponent(currentSessionId)}/traces`)
            const stats = traceData.turnStats || []
            setLastTokenStats(stats[stats.length - 1] || null)
          } catch (err) { setError(String(err.message || err)) }
        })()
      }, [currentSessionId, bootDone])

      useEffect(() => {
        const el = chatRef.current
        if (el) el.scrollTop = el.scrollHeight
      }, [history])

      useEffect(() => { setGreetingIdx(0) }, [currentCharacterId])

      const refreshCharacters = useCallback(async () => {
        try { const r = await apiGet('/api/characters'); setCharacters(r.characters || []) } catch (err) { setError(String(err.message || err)) }
      }, [])

      const refreshHealth = useCallback(async () => {
        try { setHealth(await apiGet('/api/health')) } catch { /* */ }
      }, [])

      const refreshCurrentUserName = useCallback(async () => {
        try {
          const personaState = await apiGet('/api/personas')
          const currentPersona = (personaState.personas || []).find((persona) => persona.id === personaState.currentPersonaId)
          setCurrentUserName(currentPersona?.name || '用户')
        } catch { /* persona is optional; keep the ST-compatible fallback */ }
      }, [])

      // 启动时拉一次 display 位正则脚本(RegexPanel CRUD 后也会自行刷新)。
      useEffect(() => { void refreshDisplayRegexScripts() }, [])

      const selectCharacter = useCallback(async (id) => {
        if (id === currentCharacterId) return
        setError(null); setLoading(true)
        try {
          const r = await apiPost(`/api/characters/${encodeURIComponent(id)}/select`, {})
          setCurrentCharacterId(id)
          setCurrentCharacter(r.character)
          setCurrentSessionId(null)
          setHistory([])
          setMvuState(null)
          setLastTokenStats(null)
          setActiveGreetingIdx(0)
          const sess = await apiGet(`/api/characters/${encodeURIComponent(id)}/sessions`)
          setCharacterSessions(sess.sessions || [])
        } catch (err) { setError(String(err.message || err)) } finally { setLoading(false) }
      }, [currentCharacterId])

      const afterImport = useCallback(async (id) => {
        await refreshCharacters()
        await selectCharacter(id)
      }, [refreshCharacters, selectCharacter])

      const importPng = useCallback(async (file) => {
        setError(null); setLoading(true)
        try {
          const fd = new FormData(); fd.append('file', file)
          const r = await apiPost('/api/import-png', fd)
          await afterImport(r.id)
        } catch (err) { setError(String(err.message || err)) } finally { setLoading(false) }
      }, [afterImport])

      const importJson = useCallback(async (text) => {
        setError(null); setLoading(true)
        try {
          const r = await apiPost('/api/import-json', text)
          await afterImport(r.id)
        } catch (err) { setError(String(err.message || err)) } finally { setLoading(false) }
      }, [afterImport])

      const refreshCharacterSessions = useCallback(async () => {
        if (currentCharacterId === null) return
        try { const r = await apiGet(`/api/characters/${encodeURIComponent(currentCharacterId)}/sessions`); setCharacterSessions(r.sessions || []) } catch (err) { setError(String(err.message || err)) }
      }, [currentCharacterId])

      // 历史会话管理:打开任意会话(跨角色时先把角色切过去,再选会话加载历史)
      const openSession = useCallback(async (s) => {
        setError(null)
        try {
          if (s.characterId && s.characterId !== currentCharacterId) {
            await selectCharacter(s.characterId)
          }
          setCurrentSessionId(s.sessionId)
        } catch (err) { setError(String(err.message || err)) }
      }, [currentCharacterId, selectCharacter])

      // 删掉的会话若是当前会话,清掉选中状态回到"未选会话"
      const onSessionDeleted = useCallback((sid) => {
        setCurrentSessionId((prev) => (prev === sid ? null : prev))
      }, [])

      const newSession = useCallback(async () => {
        if (currentCharacter === null || currentCharacterId === null) { setError('请先选中一个角色。'); return }
        setError(null); setLoading(true)
        try {
          const firstMes = greetingIdx === 0 ? currentCharacter.firstMes : (currentCharacter.alternateGreetings[greetingIdx - 1] || currentCharacter.firstMes)
          const r = await apiPost('/api/session', {
            characterId: currentCharacterId,
            label: currentCharacter.name,
            firstMes,
            greetingIndex: greetingIdx,
          })
          setCurrentSessionId(r.sessionId); setHistory([]); setLastTokenStats(null)
          setMvuState(null)
          setActiveGreetingIdx(Number.isInteger(r.greetingIndex) ? r.greetingIndex : greetingIdx)
          await refreshCharacterSessions()
        } catch (err) { setError(String(err.message || err)) } finally { setLoading(false) }
      }, [currentCharacter, currentCharacterId, greetingIdx, refreshCharacterSessions])

      // 开场白切换器:当前会话直接替换第一条 assistant 开场白；尚未建会话时
      // 只记录新会话将使用的开场白。这样重 roll 后控件仍然可用。
      const switchGreeting = useCallback(async (nextIndex) => {
        const index = Number(nextIndex)
        if (!Number.isInteger(index) || currentCharacter === null) return
        if (currentSessionId === null) { setGreetingIdx(index); return }
        if (loading) return
        setError(null); setLoading(true)
        try {
          const r = await apiPut(`/api/sessions/${encodeURIComponent(currentSessionId)}/greeting`, { greetingIndex: index })
          setActiveGreetingIdx(Number.isInteger(r.greetingIndex) ? r.greetingIndex : index)
          setHistory(r.history || [])
          setMvuState(r.mvuState ?? null)
          await refreshCharacterSessions()
        } catch (err) { setError(String(err.message || err)) } finally { setLoading(false) }
      }, [currentCharacter, currentSessionId, loading, refreshCharacterSessions])

      // /api/run 的 SSE 消费核心:send(新输入)与 reroll(重 roll)共用。
      // 返回 true=流正常结束。bodyObj 为 POST body(不含流处理差异)。
      const streamRun = useCallback(async (bodyObj, lifecycle = {}) => {
        const sessionId = bodyObj?.sessionId || currentSessionId
        const generationType = lifecycle.generationType || (bodyObj?.reroll ? 'swipe' : 'normal')
        const messageId = Number.isSafeInteger(lifecycle.messageId) ? lifecycle.messageId : -1
        let lifecycleFinished = false
        const stopGeneration = () => {
          if (lifecycleFinished) return
          lifecycleFinished = true
          broadcastCardHostEvent(sessionId, 'generation_stopped', generationType)
        }
        // Evaluate Tavern Helper's function-valued filters at the same
        // generation boundary as ST. This is a local iframe handshake, not
        // an extra LLM request; failures leave the durable snapshot intact.
        try { await prepareCardHostInjections(sessionId) } catch (error) { console.warn('[agent-rp Tavern Helper filter]', error) }
        // Match SillyTavern's host lifecycle. The actual prompt pipeline still
        // runs on the server, but card extensions must see the same ordering
        // before their generation hooks are evaluated.
        if (!bodyObj?.reroll) broadcastCardHostEvent(sessionId, 'message_sent', Number.isSafeInteger(lifecycle.userMessageId) ? lifecycle.userMessageId : -1)
        broadcastCardHostEvent(sessionId, 'generation_started', generationType, {}, false)
        broadcastCardHostEvent(sessionId, 'GENERATION_AFTER_COMMANDS', generationType, {}, false)
        if (bodyObj?.reroll) broadcastCardHostEvent(sessionId, 'message_deleted', messageId)
        let resp
        try {
          resp = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(bodyObj) })
        } catch (err) {
          setError(`网络错误: ${err instanceof Error ? err.message : String(err)}`)
          stopGeneration()
          return false
        }
        if (!resp.ok || resp.body === null) {
          const t = await resp.text().catch(() => '')
          setError(`服务器错误 ${resp.status}: ${t}`)
          stopGeneration()
          return false
        }
        const reader = resp.body.getReader()
        const decoder = new TextDecoder('utf-8')
        let buffer = ''
        let streamErrored = false
        try {
          while (true) {
            const { value, done } = await reader.read()
            if (done) break
            buffer += decoder.decode(value, { stream: true })
            const parsed = parseSseBuffer(buffer)
            buffer = parsed.rest
            for (const ev of parsed.events) {
              if (ev.event === 'stage') {
                let payload; try { payload = JSON.parse(ev.data) } catch { continue }
                if (payload.name === 'final') {
                  const rawMessage = payload.result && typeof payload.result.message === 'object'
                    ? payload.result.message
                    : null
                  const message = rawMessage === null
                    ? { role: 'assistant', content: payload.result.displayReply || payload.result.reply }
                    : { ...rawMessage, content: payload.result.displayReply || rawMessage.content || payload.result.reply }
                  setHistory((prev) => [...prev, message])
                  setMvuState(payload.result.mvuState ?? null)
                  setLastTokenStats(payload.result.tokenStats || null)
                  setProgressStages((prev) => ({ ...prev, [payload.name]: payload.status }))
                  if (!lifecycleFinished) {
                    lifecycleFinished = true
                    broadcastCardHostEvent(sessionId, 'message_received', messageId, generationType)
                    broadcastCardHostEvent(sessionId, 'character_message_rendered', messageId, generationType)
                    broadcastCardHostEvent(sessionId, 'generation_ended', generationType)
                  }
                } else if (payload.name === 'error') {
                  setError(payload.message || '未知错误')
                  streamErrored = true
                  stopGeneration()
                  setProgressStages((prev) => ({ ...prev, [payload.name]: 'error' }))
                } else {
                  // 顶层 stage(intent/worldbook/context/response/summarize) + 5 个
                  // 同步 postprocess 子 stage；意象 extract 在后台异步，不阻塞这里。
                  // 都是独立 stage。
                  // 后端 status 协议是 'start' / 'done' / 'error',前端 UI 状态机用
                  // 'pending' / 'running' / 'done' / 'error'。把 'start' 映射成 'running',
                  // 这样 StageTraceCard 能正确显示转圈(…)而不是看起来像没动(○)。
                  const mappedStatus = payload.status === 'start' ? 'running' : payload.status
                  setProgressStages((prev) => ({ ...prev, [payload.name]: mappedStatus }))
                }
              } else if (ev.event === 'agent-trace') {
                let payload; try { payload = JSON.parse(ev.data) } catch { continue }
                setTraces((prev) => ({ ...prev, [payload.name]: payload }))
              } else if (ev.event === 'mvu-result') {
                let payload; try { payload = JSON.parse(ev.data) } catch { continue }
                const patchedReply = payload.displayReply || payload.reply
                if (typeof patchedReply === 'string') {
                  setHistory((prev) => {
                    const next = [...prev]
                    for (let i = next.length - 1; i >= 0; i--) {
                      if (next[i]?.role === 'assistant') {
                        next[i] = payload.message && typeof payload.message === 'object'
                          ? { ...payload.message, content: patchedReply }
                          : { ...next[i], content: patchedReply }
                        return next
                      }
                    }
                    return next
                  })
                }
                if (payload.mvuState !== undefined) setMvuState(payload.mvuState)
                if (payload.tokenStats !== undefined) setLastTokenStats(payload.tokenStats)
              } else if (ev.event === 'error') {
                let msg = '未知错误'; try { msg = (JSON.parse(ev.data)).message || msg } catch { /* */ }
                setError(msg); streamErrored = true; stopGeneration()
              }
            }
          }
        } catch (err) {
          setError(`读取 SSE 失败: ${err instanceof Error ? err.message : String(err)}`)
          streamErrored = true; stopGeneration()
        }
        return !streamErrored
      }, [currentSessionId])

      const send = useCallback(async () => {
        const text = userInput.trim()
        if (text.length === 0) return
        if (currentCharacter === null || currentCharacterId === null) { setError('请先选中一个角色。'); return }
        if (currentSessionId === null) { setError('请先新建一个会话。'); return }
        setError(null); setLoading(true)
        setProgressStages({ intent: 'running', worldbook: 'pending', context: 'pending', response: 'pending', summarize: 'pending' })
        setTraces({})
        setLastTokenStats(null)
        setHistory((prev) => [...prev, { role: 'user', content: text }])
        setUserInput('')
        const ok = await streamRun(
          { userInput: text, sessionId: currentSessionId },
          { generationType: 'normal', userMessageId: history.length, messageId: history.length + 1 },
        )
        setLoading(false); setProgressStages(INITIAL_STAGES)
        if (!ok) setHistory((prev) => prev.slice(0, -1))
        else refreshCharacterSessions()
        setTimeout(() => setProgressStages(INITIAL_STAGES), 5000)
      }, [userInput, history.length, currentCharacter, currentCharacterId, currentSessionId, refreshCharacterSessions, streamRun])

      // 重 roll:服务端截掉最后一条 assistant 并复用该轮 user 输入重新生成。
      const reroll = useCallback(async () => {
        if (currentSessionId === null || loading) return
        const last = history[history.length - 1]
        if (!last || last.role !== 'assistant') { setError('只能重 roll 最后一条角色回复。'); return }
        setError(null); setLoading(true)
        // intent/worldbook are reused by the server on reroll; show the
        // visible pipeline beginning at context instead of implying that
        // those two agents are executed again.
        setProgressStages({ intent: 'done', worldbook: 'done', context: 'done', response: 'running', summarize: 'pending' })
        setTraces({})
        setLastTokenStats(null)
        setHistory((prev) => prev.slice(0, -1))
        const ok = await streamRun(
          { reroll: true, sessionId: currentSessionId },
          { generationType: 'swipe', messageId: history.length - 1 },
        )
        setLoading(false)
        if (!ok) {
          // 失败时从服务端拉真实历史(截断可能已发生也可能没有,以服务端为准)
          try {
            const r = await apiGet(`/api/history?sessionId=${encodeURIComponent(currentSessionId)}`)
            setHistory(r.history || [])
          } catch { /* swallow */ }
        } else refreshCharacterSessions()
        setProgressStages(INITIAL_STAGES)
        setTimeout(() => setProgressStages(INITIAL_STAGES), 5000)
      }, [currentSessionId, loading, history, refreshCharacterSessions, streamRun])

      const saveMessageEdit = useCallback(async (index, content) => {
        if (currentSessionId === null) return
        try {
          const r = await apiPut(`/api/sessions/${encodeURIComponent(currentSessionId)}/message/${index}`, { content })
          setHistory(r.history || [])
          setMvuState(r.mvuState ?? null)
          broadcastCardHostEvent(currentSessionId, 'message_edited', index)
          broadcastCardHostEvent(currentSessionId, 'message_updated', index)
          refreshCharacterSessions()
        } catch (err) {
          setError(String(err.message || err))
          throw err
        }
      }, [currentSessionId, refreshCharacterSessions])

      const switchSwipe = useCallback(async (index, swipeId) => {
        if (currentSessionId === null || loading) return
        try {
          const r = await apiPut(`/api/sessions/${encodeURIComponent(currentSessionId)}/message/${index}/swipe`, { swipeId })
          setHistory(r.history || [])
          setMvuState(r.mvuState ?? null)
          broadcastCardHostEvent(currentSessionId, 'message_swiped', index, swipeId)
          broadcastCardHostEvent(currentSessionId, 'message_updated', index)
        } catch (err) {
          setError(String(err.message || err))
        }
      }, [currentSessionId, loading])

      const deleteMessage = useCallback(async (index) => {
        if (currentSessionId === null || loading) return
        if (!window.confirm(`删除第 ${index + 1} 层？此操作不可恢复。`)) return
        try {
          await apiDelete(`/api/sessions/${encodeURIComponent(currentSessionId)}/message/${index}`)
          broadcastCardHostEvent(currentSessionId, 'message_deleted', index)
          const r = await apiGet(`/api/history?sessionId=${encodeURIComponent(currentSessionId)}`)
          setHistory(r.history || [])
          setMvuState(r.mvuState ?? null)
          refreshCharacterSessions()
        } catch (err) { setError(String(err.message || err)) }
      }, [currentSessionId, loading, refreshCharacterSessions])

      const onKeyDown = (ev) => {
        if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); send() }
      }

      const onUploadPng = (ev) => {
        const file = ev.target.files && ev.target.files[0]
        if (file) importPng(file)
        ev.target.value = ''
      }

      const onUploadJson = (ev) => {
        const file = ev.target.files && ev.target.files[0]
        if (!file) return
        const reader = new FileReader()
        reader.onload = () => importJson(String(reader.result || ''))
        reader.onerror = () => setError('读取 JSON 文件失败')
        reader.readAsText(file)
        ev.target.value = ''
      }

      const currentGreeting = currentCharacter === null
        ? '' : (greetingIdx === 0 ? currentCharacter.firstMes : (currentCharacter.alternateGreetings[greetingIdx - 1] || currentCharacter.firstMes))
      const greetingTotal = currentCharacter === null ? 0 : (1 + (currentCharacter.alternateGreetings || []).length)
      const cycleGreeting = () => { if (greetingTotal > 1) setGreetingIdx((idx) => (idx + 1) % greetingTotal) }
      const chatGreetingIndex = currentSessionId === null ? greetingIdx : activeGreetingIdx
      const chatGreetingSwitcher = greetingTotal > 1
        ? h('div', { className: 'chat-greeting-switcher', title: currentSessionId === null ? '新建会话时使用此开场白' : '切换当前会话的开场白' },
            h('span', { className: 'chat-greeting-label' }, '开局'),
            h('button', {
              className: 'mini', disabled: loading || chatGreetingIndex <= 0,
              onClick: () => { void switchGreeting(chatGreetingIndex - 1) },
              title: '上一个开场白',
            }, '‹'),
            h('select', {
              className: 'chat-greeting-select', value: String(chatGreetingIndex), disabled: loading,
              onChange: (e) => { void switchGreeting(e.target.value) },
              'aria-label': '选择开场白',
            },
              h('option', { value: '0' }, `主开场白  ·  1/${greetingTotal}`),
              (currentCharacter.alternateGreetings || []).map((_, i) => h('option', { key: i + 1, value: String(i + 1) }, `备选开场白 ${i + 1}  ·  ${i + 2}/${greetingTotal}`)),
            ),
            h('button', {
              className: 'mini', disabled: loading || chatGreetingIndex >= greetingTotal - 1,
              onClick: () => { void switchGreeting(chatGreetingIndex + 1) },
              title: '下一个开场白',
            }, '›'),
          )
        : null

      const characterBlock = currentCharacter
        ? h('div', { className: 'character-card' },
            h('div', { className: 'name' }, currentCharacter.name),
            h('div', { className: 'greeting' },
              h('div', { className: 'greeting-head' },
                h('span', null, `开场白 (${greetingIdx + 1}/${greetingTotal})`),
                greetingTotal > 1 ? h('button', { onClick: cycleGreeting, disabled: loading, title: '循环切换主开场白与备选开场白' }, '↻ 切换') : null,
              ),
              h('textarea', { readOnly: true, value: currentGreeting, rows: 4, style: { marginTop: '4px' } }),
            ),
            h('div', { className: 'docs' },
              docBlock('人设 (persona)', currentCharacter.persona, '基础人设 + 来自世界书的角色档案/性格条目,常驻注入 agent 3'),
              docBlock('世界观 (worldview)', currentCharacter.worldview, '世界/场景/背景设定,常驻注入 agent 3'),
              docBlock('文风/要求 (style)', currentCharacter.style, '回复要求 + 来自世界书的叙事风格/回复格式,常驻注入 agent 3'),
            ),
            h('div', { className: 'hint' }, `预处理时间: ${fmtTime(currentCharacter.preprocessedAt)}`),
            h('div', { className: 'row', style: { marginTop: '6px' } },
              h('button', { className: 'primary', onClick: newSession, disabled: loading, style: { flex: 1 } }, '新建会话(用当前开场白)'),
            ),
          )
        : h('div', { className: 'character-card' },
            h('div', { className: 'empty' }, bootDone ? '尚未选中角色。打开左侧「角色」面板选择，或从「导入」面板添加。' : '正在加载…'),
          )

      const charactersBlock = h('div', { className: 'panel' },
        h('h2', null, `角色库 (${characters.length})`),
        characters.length === 0
          ? h('div', { className: 'list-empty' }, bootDone ? '尚无角色' : '加载中…')
          : h('div', { className: 'list' },
              characters.map((c) => h('div', {
                key: c.id, className: 'list-item' + (c.id === currentCharacterId ? ' active' : ''),
                onClick: () => selectCharacter(c.id), title: c.name,
              },
                h('div', null,
                  h('div', { className: 'name' }, c.name),
                  h('div', { className: 'sub' }, c.personaPreview || '—'),
                ),
                h('div', { className: 'right' },
                  c.hasLorebook ? h('span', { className: 'badge', title: '内嵌世界书' }, '📖') : null,
                  h('span', { className: 'meta' }, c.greetingCount + 'g'),
                ),
              )),
            ),
      )

      const importBlock = h('div', { className: 'panel' },
        h('div', { className: 'panel-head' },
          h('h2', null, '导入'),
          h('span', { className: 'panel-kicker' }, '角色卡 / 世界书'),
        ),
        h('div', { className: 'field' },
          h('div', { className: 'row' },
            h('button', { onClick: () => fileRef.current && fileRef.current.click(), disabled: loading }, '导入 PNG'),
            h('button', { onClick: () => {
              const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json'
              inp.onchange = onUploadJson; inp.click()
            }, disabled: loading }, '导入 JSON'),
          ),
          h('input', { ref: fileRef, type: 'file', accept: 'image/png', style: { display: 'none' }, onChange: onUploadPng }),
          h('div', { className: 'hint' }, '导入角色卡 PNG/JSON；独立世界书在世界书面板中管理。'),
        ),
      )

      const sessionsBlock = h(SessionsPanel, {
        currentSessionId,
        currentCharacterId,
        onOpenSession: openSession,
        onSessionDeleted,
        onError: setError,
        refreshTick: history.length,
      })

      const characterSummary = h('div', { className: 'chat-character-strip' },
        h('div', { className: 'character-avatar' }, currentCharacter ? currentCharacter.name.slice(0, 2) : 'RP'),
        h('div', { className: 'chat-character-copy' },
          h('div', { className: 'chat-character-name' }, currentCharacter ? currentCharacter.name : 'DSH Agent RP'),
        h('div', { className: 'chat-character-status' }, currentSessionId ? '当前会话已连接' : (currentCharacter ? '尚未开始会话' : '请从角色面板选择角色')),
        ),
        h('div', { className: 'chat-character-actions' },
          lastTokenStats ? h('span', { className: 'turn-token-badge', title: '最近一轮 token 统计；完整 agent 明细见 Trace' }, `本轮 ${fmtTokens(lastTokenStats.total?.totalTokens)} tok`) : null,
          h('button', { className: 'mini', onClick: () => setActiveTool('character') }, currentCharacter ? '角色信息' : '选择角色'),
          h('button', { className: 'mini', onClick: () => setActiveTool('sessions') }, '会话'),
        ),
      )

      const activeToolDef = TOOL_DEFS.find((tool) => tool.id === activeTool) || null
      const toolContent = activeTool === 'character'
        ? h('div', { className: 'tool-stack' }, characterBlock, charactersBlock)
        : activeTool === 'sessions'
          ? sessionsBlock
          : activeTool === 'ui'
            ? h(UiSettingsPanel, { chatWidth: uiSettings.chatWidth, onChatWidthChange: changeChatWidth })
          : activeTool === 'api'
            ? h(ApiConfigPanel, { onConfigChange: refreshHealth })
          : activeTool === 'extensions'
            ? h(ExtensionsPanel, { onError: setError })
          : activeTool === 'persona'
              ? h(PersonaPanel, { onError: setError, onPersonaChange: refreshCurrentUserName })
              : activeTool === 'worldbooks'
                ? h(WorldbooksPanel, { currentCharacterId, onWorldbookChange: refreshHealth, onError: setError })
                : activeTool === 'regex'
                  ? h(RegexPanel, { onError: setError })
                  : activeTool === 'import'
                    ? importBlock
                    : activeTool === 'prompts'
                      ? h(PromptsPanel, null)
                      : activeTool === 'trace'
                        ? h(TracePanel, { currentSessionId, refreshTick: history.length, onError: setError })
                        : null

      const toggleTool = (id) => setActiveTool((previous) => previous === id ? null : id)
      const railTools = TOOL_DEFS.map((tool) => h('button', {
        key: tool.id,
        className: 'rail-button' + (activeTool === tool.id ? ' active' : ''),
        onClick: () => toggleTool(tool.id),
        title: tool.label,
        'aria-label': tool.label,
      },
        h('span', { className: 'rail-icon', 'aria-hidden': 'true' }, tool.icon),
        h('span', { className: 'rail-label' }, tool.label),
      ))

      return h('div', { className: 'app' },
        h('header', { className: 'header' },
          h('div', { className: 'brand-lockup' },
            h('div', { className: 'brand-mark' }, 'RP'),
            h('div', null,
              h('h1', null, 'DSH Agent RP'),
              h('div', { className: 'brand-subtitle' }, 'SillyTavern-inspired roleplay workspace'),
            ),
          ),
          h('div', { className: 'header-context' },
            currentCharacter ? currentCharacter.name : '未选择角色',
            currentSessionId ? h('span', { className: 'header-context-dot' }, '· 会话中') : null,
          ),
          h('div', { className: 'header-actions' },
            health && h('span', { className: 'connection-pill' },
              h('span', { className: 'connection-dot' }),
              `${health.model} · ${health.characterCount} 角色`,
            ),
            h('button', { className: 'primary', onClick: newSession, disabled: loading || currentCharacter === null, title: '在当前角色下新建会话' }, '＋ 新建会话'),
          ),
        ),
        h('div', { className: 'body' },
          h('nav', { className: 'tool-rail', 'aria-label': '工具导航' },
            h('div', { className: 'rail-top' },
              h('div', { className: 'rail-brand' }, '⌁'),
              h('div', { className: 'rail-section-label' }, '工作区'),
              railTools.slice(0, 2),
              h('div', { className: 'rail-section-label rail-section-label-secondary' }, '工具'),
              railTools.slice(2),
            ),
            h('div', { className: 'rail-bottom' },
              h('span', { className: 'rail-version' }, 'DSH'),
            ),
          ),
          h('main', { className: 'main' },
            characterSummary,
            error && h('div', { className: 'error-banner', style: { margin: '0 12px' } }, error),
            loading && h(AgentProgress, { stages: progressStages, traces }),
            h('div', { className: 'chat', ref: chatRef, style: { '--chat-content-width': `${clampChatWidth(uiSettings.chatWidth)}%` } },
              history.length === 0
                ? h('div', { className: 'msg system' },
                    currentSessionId ? '会话已就绪。输入消息开始聊天 (⌘/Ctrl+Enter 发送)。' :
                    (currentCharacterId ? '已选中角色。点击右上「新建会话」开始聊天。' : '打开左侧「角色」面板选择一个角色开始。'))
                : history.map((m, i) => h(MessageFloor, {
                    key: `${m.role}-${i}`,
                    message: m, index: i, total: history.length,
                    character: currentCharacter, sessionId: currentSessionId, userName: currentUserName, mvuState,
                    onVariablesChange: onCardVariablesChange,
                    disabled: currentSessionId === null || loading,
                    onReroll: i === history.length - 1 && m.role === 'assistant' ? reroll : null,
                    onSwipe: switchSwipe,
                    onSaveEdit: saveMessageEdit,
                    onDelete: deleteMessage,
                  })),
            ),
            h('div', { className: 'composer' },
              chatGreetingSwitcher,
              h('div', { className: 'composer-main' },
                h('textarea', {
                  value: userInput, onChange: (e) => setUserInput(e.target.value), onKeyDown,
                  placeholder: currentSessionId ? '输入消息… (⌘/Ctrl+Enter 发送)' : '先打开「角色」或「会话」面板开始',
                  disabled: loading || currentSessionId === null,
                }),
                h('button', {
                  className: 'primary send', onClick: send,
                  disabled: loading || userInput.trim().length === 0 || currentSessionId === null,
                }, loading ? '生成中…' : '发送'),
              ),
            ),
          ),
          activeTool && h('div', { className: 'drawer-scrim', onClick: () => setActiveTool(null), 'aria-hidden': 'true' }),
          activeTool && h('aside', { className: `tool-drawer ${activeToolDef?.side || 'left'}`, 'aria-label': activeToolDef?.label || '工具面板' },
            h('div', { className: 'tool-drawer-header' },
              h('div', null,
                h('div', { className: 'tool-drawer-kicker' }, 'WORKSPACE TOOL'),
                h('h2', null, activeToolDef?.label || '工具'),
              ),
              h('button', { className: 'drawer-close', onClick: () => setActiveTool(null), title: '关闭面板', 'aria-label': '关闭面板' }, '×'),
            ),
            h('div', { className: 'tool-drawer-body' }, toolContent),
          ),
        ),
      )
    }

    function docBlock(title, body, hint) {
      return h('div', { className: 'doc' },
        h('h3', null, title),
        h('pre', null, body && body.length > 0 ? body : '—'),
        hint ? h('div', { className: 'doc-hint' }, hint) : null,
      )
    }

    // 顶层错误兜底:React 渲染时抛错会让整页黑屏,这里把异常显示到 root 里方便调试
    window.addEventListener('error', (e) => {
      const root = document.getElementById('root')
      if (root && root.children.length === 0) {
        root.innerHTML = `<pre style="color:#ff5252;padding:12px;font-size:12px;white-space:pre-wrap">UI 渲染失败:\n${String(e.error?.stack ?? e.message)}</pre>`
      }
    })
    window.addEventListener('unhandledrejection', (e) => {
      const root = document.getElementById('root')
      if (root && root.children.length === 0) {
        root.innerHTML = `<pre style="color:#ff5252;padding:12px;font-size:12px;white-space:pre-wrap">未捕获异常:\n${String(e.reason?.stack ?? e.reason)}</pre>`
      }
    })

    try {
      const root = createRoot(document.getElementById('root'))
      root.render(h(App))
    } catch (err) {
      document.getElementById('root').innerHTML = `<pre style="color:#ff5252;padding:12px;font-size:12px;white-space:pre-wrap">启动失败:\n${String(err?.stack ?? err)}</pre>`
    }
  </script>
</body>
</html>
